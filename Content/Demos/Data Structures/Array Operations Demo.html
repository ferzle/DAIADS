<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/DAIADS/scripts/content-page-routing.js"></script>
  <meta charset="UTF-8">
  <title>Array Operations Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    .array-demo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .array-demo-controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 4px;
    }
    .array-demo-controls input {
      width: 70px;
    }
    .array-step-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }
    #stepInfo {
      color: #333;
      font-size: 13px;
      font-weight: bold;
    }
    .array-stats {
      margin: 8px 0;
      font-weight: bold;
    }
    .array-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      margin-top: 10px;
    }
    .array-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .array-cell {
      width: 46px;
      height: 42px;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #cce3ff;
      box-sizing: border-box;
      font-weight: bold;
    }
    .array-index {
      font-size: 12px;
      color: #333;
    }
    .array-unused .array-cell {
      background: #f6f6f6;
      color: #777;
      border-style: dashed;
      font-weight: normal;
    }
    .array-cell.active {
      background: #ffe16a;
    }
    .array-cell.shift {
      background: #ffa088;
    }
    .array-cell.found {
      background: #74b474;
    }
    .array-cell.inserted {
      background: #8ecae6;
    }
    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 6px 8px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
    }
  </style>
</head>
<body class="no-tooltips">
  <div id="demoContainer">
    <h2>Array Operations Demo</h2>

    <div class="array-demo-controls">
      <label>v=<input id="valueInput" type="number" value="22"></label>
      <label>i=<input id="indexInput" type="number" value="2" min="0"></label>
      <button id="accessBtn" class="operation-btn">A[i]</button>
      <button id="assignBtn" class="operation-btn">A[i]=v</button>
      <button id="searchBtn" class="operation-btn">Search(v)</button>
      <button id="insertBtn" class="operation-btn">InsertAt(i, v)</button>
      <button id="deleteBtn" class="operation-btn">DeleteAt(i)</button>
      <button id="appendBtn" class="operation-btn">Append(v)</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="legend">
      <strong>Legend:</strong>
      <span class="legend-box" style="background:#ffe16a;"></span>Accessed
      <span class="legend-box" style="background:#74b474;"></span>Found
      <span class="legend-box" style="background:#ffa088;"></span>Shifted
      <span class="legend-box" style="background:#8ecae6;"></span>Inserted/written
      <span class="legend-box" style="background:#f6f6f6;"></span>Unused capacity
    </div>

    <div class="array-step-controls">
      <button id="prevStepBtn" disabled>Previous Step</button>
      <button id="nextStepBtn" disabled>Next Step</button>
      <button id="finishStepBtn" disabled>Finish Operation</button>
      <span id="stepInfo"></span>
    </div>

    <div class="array-stats" id="stats"></div>
    <div id="status"></div>
    <div id="arrayStrip" class="array-strip"></div>
  </div>

  <script>
    let values;
    let capacity;
    let highlights = {};
    let activeSteps = [];
    let stepIndex = -1;

    function resetState() {
      values = [14, 8, 31, 5, 20];
      capacity = 8;
      highlights = {};
      clearStepRun();
      render('Initial dynamic array. Size is the number of stored values; capacity is the number of allocated slots.');
    }

    function getIndex() {
      return Number.parseInt(document.getElementById('indexInput').value, 10);
    }

    function getValue() {
      return Number.parseInt(document.getElementById('valueInput').value, 10);
    }

    function ensureCapacity() {
      if (values.length < capacity) {
        return false;
      }
      capacity = Math.max(1, capacity * 2);
      return true;
    }

    function render(message) {
      document.getElementById('stats').textContent = `size = ${values.length}, capacity = ${capacity}`;
      document.getElementById('status').textContent = message;

      const strip = document.getElementById('arrayStrip');
      strip.innerHTML = '';

      for (let i = 0; i < capacity; i++) {
        const slot = document.createElement('div');
        slot.className = 'array-slot';
        if (i >= values.length) {
          slot.classList.add('array-unused');
        }

        const cell = document.createElement('div');
        cell.className = 'array-cell';
        if (highlights[i]) {
          cell.classList.add(highlights[i]);
        }
        cell.textContent = i < values.length ? values[i] : '';

        const label = document.createElement('div');
        label.className = 'array-index';
        label.textContent = i;

        slot.appendChild(cell);
        slot.appendChild(label);
        strip.appendChild(slot);
      }
    }

    function updateStepControls() {
      const hasSteps = activeSteps.length > 0;
      const atFinalStep = hasSteps && stepIndex === activeSteps.length - 1;

      document.getElementById('prevStepBtn').disabled = !hasSteps || stepIndex <= 0;
      document.getElementById('nextStepBtn').disabled = !hasSteps || atFinalStep;
      document.getElementById('finishStepBtn').disabled = !hasSteps || atFinalStep;
      document.getElementById('stepInfo').textContent = hasSteps ? `Step ${stepIndex + 1} of ${activeSteps.length}` : '';

      document.querySelectorAll('.operation-btn').forEach((button) => {
        button.disabled = hasSteps && !atFinalStep;
      });
    }

    function clearStepRun(updateControls = true) {
      activeSteps = [];
      stepIndex = -1;
      if (updateControls) {
        updateStepControls();
      }
    }

    function makeStep(message, stepValues, stepCapacity, stepHighlights = {}) {
      return {
        message,
        values: stepValues.slice(),
        capacity: stepCapacity,
        highlights: { ...stepHighlights }
      };
    }

    function showStep(nextIndex) {
      stepIndex = nextIndex;
      const step = activeSteps[stepIndex];
      values = step.values.slice();
      capacity = step.capacity;
      highlights = { ...step.highlights };
      render(step.message);
      updateStepControls();
    }

    function startStepRun(steps) {
      activeSteps = steps;
      if (activeSteps.length === 0) {
        clearStepRun();
        return;
      }
      showStep(0);
    }

    function finishStepRun() {
      if (activeSteps.length > 0) {
        showStep(activeSteps.length - 1);
      }
    }

    function setMessage(message, newHighlights = {}) {
      clearStepRun();
      highlights = newHighlights;
      render(message);
    }

    document.getElementById('accessBtn').addEventListener('click', () => {
      const i = getIndex();
      if (!Number.isInteger(i) || i < 0 || i >= values.length) {
        setMessage(`Index ${i} is outside the logical array.`);
        return;
      }
      setMessage(`A[${i}] = ${values[i]}. Direct indexed access is O(1).`, { [i]: 'active' });
    });

    document.getElementById('assignBtn').addEventListener('click', () => {
      const i = getIndex();
      const value = getValue();
      if (!Number.isInteger(i) || i < 0 || i >= values.length) {
        setMessage(`Assignment index ${i} must be between 0 and ${values.length - 1}.`);
        return;
      }
      const oldValue = values[i];
      values[i] = value;
      setMessage(`A[${i}] changed from ${oldValue} to ${value}. Indexed assignment is O(1).`, { [i]: 'inserted' });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const target = getValue();
      const steps = [];

      if (values.length === 0) {
        setMessage(`The array is empty, so ${target} is not present.`);
        return;
      }

      for (let j = 0; j < values.length; j++) {
        if (values[j] === target) {
          steps.push(makeStep(`Check A[${j}] = ${values[j]}. It matches ${target}, so search stops at index ${j}.`, values, capacity, { [j]: 'found' }));
          startStepRun(steps);
          return;
        }

        steps.push(makeStep(`Check A[${j}] = ${values[j]}. It does not match ${target}, so continue right.`, values, capacity, { [j]: 'active' }));
      }

      steps.push(makeStep(`Every array element has been checked. ${target} is not present.`, values, capacity));
      startStepRun(steps);
    });

    document.getElementById('appendBtn').addEventListener('click', () => {
      const value = getValue();
      const resized = ensureCapacity();
      values.push(value);
      setMessage(
        resized
          ? `Capacity doubled first, then ${value} was appended at the end.`
          : `${value} was appended at the end.`,
        { [values.length - 1]: 'inserted' }
      );
    });

    document.getElementById('insertBtn').addEventListener('click', () => {
      const i = getIndex();
      const value = getValue();
      if (!Number.isInteger(i) || i < 0 || i > values.length) {
        setMessage(`Insertion index ${i} must be between 0 and ${values.length}.`);
        return;
      }

      const resized = ensureCapacity();
      const steps = [];
      const working = values.slice();

      if (i === values.length) {
        values.push(value);
        setMessage(
          resized
            ? `Capacity doubled first, then ${value} was inserted at the end.`
            : `${value} was inserted at the end. No elements needed to shift.`,
          { [values.length - 1]: 'inserted' }
        );
        return;
      }

      const oldLastIndex = working.length - 1;
      working.push(working[oldLastIndex]);
      steps.push(makeStep(
        resized
          ? `Capacity doubled. Shift A[${oldLastIndex}] = ${working[oldLastIndex]} right into index ${oldLastIndex + 1}.`
          : `Shift A[${oldLastIndex}] = ${working[oldLastIndex]} right into index ${oldLastIndex + 1}.`,
        working,
        capacity,
        { [oldLastIndex]: 'active', [oldLastIndex + 1]: 'shift' }
      ));

      for (let j = working.length - 3; j >= i; j--) {
        working[j + 1] = working[j];
        steps.push(makeStep(`Shift A[${j}] = ${working[j]} right into index ${j + 1}.`, working, capacity, { [j]: 'active', [j + 1]: 'shift' }));
      }

      working[i] = value;
      steps.push(makeStep(`Write ${value} into A[${i}]. Insertion is complete.`, working, capacity, { [i]: 'inserted' }));
      startStepRun(steps);
    });

    document.getElementById('deleteBtn').addEventListener('click', () => {
      const i = getIndex();
      if (!Number.isInteger(i) || i < 0 || i >= values.length) {
        setMessage(`Deletion index ${i} must be between 0 and ${values.length - 1}.`);
        return;
      }

      const removed = values[i];
      if (i === values.length - 1) {
        values.pop();
        setMessage(`Removed ${removed} from the last index. No elements needed to shift.`, { [i]: 'shift' });
        return;
      }

      const steps = [];
      const working = values.slice();
      for (let j = i + 1; j < working.length; j++) {
        working[j - 1] = working[j];
        steps.push(makeStep(`Shift A[${j}] = ${working[j]} left into index ${j - 1}.`, working, capacity, { [j]: 'active', [j - 1]: 'shift' }));
      }
      working.pop();
      steps.push(makeStep(`Removed ${removed}. The duplicate last slot is outside the logical array, so size decreases by one.`, working, capacity, { [Math.max(i, working.length - 1)]: 'shift' }));
      startStepRun(steps);
    });

    document.getElementById('prevStepBtn').addEventListener('click', () => {
      if (stepIndex > 0) {
        showStep(stepIndex - 1);
      }
    });

    document.getElementById('nextStepBtn').addEventListener('click', () => {
      if (stepIndex < activeSteps.length - 1) {
        showStep(stepIndex + 1);
      }
    });

    document.getElementById('finishStepBtn').addEventListener('click', finishStepRun);

    document.getElementById('resetBtn').addEventListener('click', resetState);

    resetState();
  </script>
</body>
</html>
