<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BST Rotation Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    .rotation-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 6px 8px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
    }
    .rotation-layout {
      display: grid;
      grid-template-columns: minmax(360px, 720px) minmax(240px, 1fr);
      gap: 16px;
      align-items: start;
      margin-top: 12px;
    }
    svg {
      width: 100%;
      max-width: 720px;
      min-height: 360px;
      border: 1px solid #ccc;
      background: #fff;
      box-sizing: border-box;
    }
    .tree-edge {
      stroke: #777;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .rotation-node circle {
      fill: #cce3ff;
      stroke: #333;
      stroke-width: 1.5;
    }
    .rotation-node.focus circle {
      fill: #ffe16a;
      stroke-width: 3;
    }
    .rotation-node.root circle {
      stroke-width: 3;
    }
    .rotation-node text {
      text-anchor: middle;
      dominant-baseline: middle;
      font-weight: bold;
      fill: #111;
    }
    .subtree rect {
      fill: #f6f6f6;
      stroke: #777;
      stroke-dasharray: 4 3;
    }
    .subtree text {
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #555;
      font-weight: bold;
    }
    .rotation-panel {
      line-height: 1.5;
    }
    .inorder-box {
      min-height: 36px;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #777;
      background: #f6f6f6;
      font-family: monospace;
      font-size: 15px;
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQ5LVZVFDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DQ5LVZVFDC');
  </script>
</head>
<body class="no-tooltips">
  <div id="demoContainer">
    <h2>BST Rotation Demo</h2>

    <div class="rotation-controls">
      <button data-case="left">Left Rotation</button>
      <button data-case="right">Right Rotation</button>
      <button data-case="leftRight">Left-Right Rotation</button>
      <button data-case="rightLeft">Right-Left Rotation</button>
      <button id="prevBtn">Previous Step</button>
      <button id="nextBtn">Next Step</button>
    </div>

    <div class="legend">
      <strong>Legend:</strong>
      <span class="legend-box" style="background:#ffe16a;"></span>Nodes being rotated
      <span class="legend-box" style="background:#cce3ff;"></span>Tree node
      <span class="legend-box" style="background:#f6f6f6;"></span>Subtree whose internal shape is unchanged
    </div>

    <div id="status"></div>
    <div class="rotation-layout">
      <svg id="rotationSvg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="rotation-panel">
        <div><strong>Case:</strong> <span id="caseTitle"></span></div>
        <div><strong>Step:</strong> <span id="stepCount"></span></div>
        <div><strong>In-order sequence:</strong></div>
        <div id="inorderBox" class="inorder-box"></div>
        <div><strong>Key idea:</strong> rotations change parent-child relationships locally but preserve the in-order order of the values.</div>
      </div>
    </div>
  </div>

  <script>
    function n(id, label, left = null, right = null) {
      return { id, label, left, right, subtree: false };
    }

    function t(id) {
      return { id, label: id, left: null, right: null, subtree: true };
    }

    function leftRotationSteps() {
      return [
        {
          title: 'Left rotation',
          message: 'Before rotating left: 10 has a right child, 20. The middle subtree T2 must stay between 10 and 20.',
          focus: ['A', 'B'],
          inorder: 'T1, 10, T2, 20, T3',
          tree: n('A', '10', t('T1'), n('B', '20', t('T2'), t('T3')))
        },
        {
          title: 'Left rotation',
          message: 'After rotating left: 20 moves up, 10 becomes its left child, and T2 becomes the right subtree of 10.',
          focus: ['A', 'B'],
          motionFocus: ['A', 'B'],
          inorder: 'T1, 10, T2, 20, T3',
          tree: n('B', '20', n('A', '10', t('T1'), t('T2')), t('T3'))
        }
      ];
    }

    function rightRotationSteps() {
      return [
        {
          title: 'Right rotation',
          message: 'Before rotating right: 20 has a left child, 10. The middle subtree T2 must stay between 10 and 20.',
          focus: ['A', 'B'],
          inorder: 'T1, 10, T2, 20, T3',
          tree: n('B', '20', n('A', '10', t('T1'), t('T2')), t('T3'))
        },
        {
          title: 'Right rotation',
          message: 'After rotating right: 10 moves up, 20 becomes its right child, and T2 becomes the left subtree of 20.',
          focus: ['A', 'B'],
          motionFocus: ['A', 'B'],
          inorder: 'T1, 10, T2, 20, T3',
          tree: n('A', '10', t('T1'), n('B', '20', t('T2'), t('T3')))
        }
      ];
    }

    function leftRightSteps() {
      return [
        {
          title: 'Left-right rotation',
          message: 'Start with a left-right shape: 30 leans left, but the heavy child 10 leans right.',
          focus: ['Y', 'X', 'Z'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('Z', '30', n('Y', '10', t('T1'), n('X', '20', t('T2'), t('T3'))), t('T4'))
        },
        {
          title: 'Left-right rotation',
          message: 'Step 1: rotate left at 10. This converts the shape into a simple left-heavy case at 30.',
          focus: ['Y', 'X'],
          motionFocus: ['Y', 'X'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('Z', '30', n('X', '20', n('Y', '10', t('T1'), t('T2')), t('T3')), t('T4'))
        },
        {
          title: 'Left-right rotation',
          message: 'Step 2: rotate right at 30. The middle value, 20, becomes the root of this local subtree.',
          focus: ['X', 'Z'],
          motionFocus: ['X', 'Z'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('X', '20', n('Y', '10', t('T1'), t('T2')), n('Z', '30', t('T3'), t('T4')))
        }
      ];
    }

    function rightLeftSteps() {
      return [
        {
          title: 'Right-left rotation',
          message: 'Start with a right-left shape: 10 leans right, but the heavy child 30 leans left.',
          focus: ['Z', 'X', 'Y'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('Z', '10', t('T1'), n('Y', '30', n('X', '20', t('T2'), t('T3')), t('T4')))
        },
        {
          title: 'Right-left rotation',
          message: 'Step 1: rotate right at 30. This converts the shape into a simple right-heavy case at 10.',
          focus: ['X', 'Y'],
          motionFocus: ['X', 'Y'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('Z', '10', t('T1'), n('X', '20', t('T2'), n('Y', '30', t('T3'), t('T4'))))
        },
        {
          title: 'Right-left rotation',
          message: 'Step 2: rotate left at 10. The middle value, 20, becomes the root of this local subtree.',
          focus: ['Z', 'X'],
          motionFocus: ['Z', 'X'],
          inorder: 'T1, 10, T2, 20, T3, 30, T4',
          tree: n('X', '20', n('Z', '10', t('T1'), t('T2')), n('Y', '30', t('T3'), t('T4')))
        }
      ];
    }

    const caseBuilders = {
      left: leftRotationSteps,
      right: rightRotationSteps,
      leftRight: leftRightSteps,
      rightLeft: rightLeftSteps
    };

    const NODE_RADIUS = 22;
    const SUBTREE_WIDTH = 44;
    const SUBTREE_HEIGHT = 32;
    const LAYOUT_WIDTH = 720;
    const LAYOUT_HEIGHT = 360;
    const ROOT_X = LAYOUT_WIDTH / 2;
    const ROOT_Y = 44;
    const ROOT_CHILD_GAP = 180;
    const MIN_CHILD_GAP = 58;
    const LEVEL_GAP = 76;
    const ANIMATION_MS = 900;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let currentCase = 'left';
    let steps = [];
    let stepIndex = 0;
    let renderedLayout = null;
    let animationFrameId = null;
    let isAnimating = false;

    function svgElement(name) {
      return document.createElementNS('http://www.w3.org/2000/svg', name);
    }

    function layoutTree(root) {
      const positions = new Map();
      const edges = [];
      const parents = new Map();
      let maxDepth = 0;

      function assign(node, depth, x) {
        if (!node) return;
        maxDepth = Math.max(maxDepth, depth);
        positions.set(node.id, {
          x,
          y: ROOT_Y + depth * LEVEL_GAP,
          node
        });

        const childGap = Math.max(MIN_CHILD_GAP, ROOT_CHILD_GAP / Math.pow(2, depth));
        if (node.left) {
          edges.push([node.id, node.left.id]);
          parents.set(node.left.id, node.id);
          assign(node.left, depth + 1, x - childGap);
        }
        if (node.right) {
          edges.push([node.id, node.right.id]);
          parents.set(node.right.id, node.id);
          assign(node.right, depth + 1, x + childGap);
        }
      }

      assign(root, 0, ROOT_X);
      return {
        positions,
        edges,
        parents,
        width: LAYOUT_WIDTH,
        height: Math.max(LAYOUT_HEIGHT, ROOT_Y + (maxDepth + 1) * LEVEL_GAP)
      };
    }

    function setAnimationBusy(busy) {
      isAnimating = busy;
      updateButtonStates();
    }

    function updateButtonStates() {
      document.querySelectorAll('[data-case]').forEach((button) => {
        button.disabled = isAnimating;
      });
      document.getElementById('prevBtn').disabled = isAnimating || stepIndex === 0;
      document.getElementById('nextBtn').disabled = isAnimating || stepIndex === steps.length - 1;
    }

    function edgeKey(edge) {
      return edge.slice().sort().join('|');
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function interpolatePoint(a, b, progress) {
      return {
        x: a.x + (b.x - a.x) * progress,
        y: a.y + (b.y - a.y) * progress
      };
    }

    function distance(a, b) {
      return Math.hypot(b.x - a.x, b.y - a.y);
    }

    function pointAlongPath(path, progress) {
      if (path.length <= 1) return path[0];

      const segmentLengths = [];
      let totalLength = 0;
      for (let i = 1; i < path.length; i += 1) {
        const length = distance(path[i - 1], path[i]);
        segmentLengths.push(length);
        totalLength += length;
      }

      if (totalLength === 0) return path[path.length - 1];

      let remaining = totalLength * progress;
      for (let i = 0; i < segmentLengths.length; i += 1) {
        if (remaining <= segmentLengths[i]) {
          const localProgress = segmentLengths[i] === 0 ? 1 : remaining / segmentLengths[i];
          return interpolatePoint(path[i], path[i + 1], localProgress);
        }
        remaining -= segmentLengths[i];
      }

      return path[path.length - 1];
    }

    function buildMotionPaths(fromLayout, toLayout, focusIds) {
      const paths = new Map();
      const focusSet = new Set(focusIds);
      const nodeIds = new Set([...fromLayout.positions.keys(), ...toLayout.positions.keys()]);

      nodeIds.forEach((id) => {
        const start = fromLayout.positions.get(id) || toLayout.positions.get(id);
        const end = toLayout.positions.get(id) || start;
        const path = [start];
        const oldParentId = fromLayout.parents.get(id);
        const newParentId = toLayout.parents.get(id);

        if (oldParentId && newParentId && oldParentId !== newParentId
            && focusSet.has(oldParentId) && focusSet.has(newParentId)) {
          const oldParent = fromLayout.positions.get(oldParentId);
          const newParent = toLayout.positions.get(newParentId);
          if (oldParent && newParent) {
            path.push({
              x: (oldParent.x + newParent.x) / 2,
              y: (oldParent.y + newParent.y) / 2
            });
          }
        }

        path.push(end);
        paths.set(id, path);
      });

      return paths;
    }

    function positionAt(id, motionPaths, progress) {
      const path = motionPaths.get(id);
      if (!path) return { x: 0, y: 0 };
      return pointAlongPath(path, progress);
    }

    function setLinePosition(line, a, b) {
      line.setAttribute('x1', a.x);
      line.setAttribute('y1', a.y);
      line.setAttribute('x2', b.x);
      line.setAttribute('y2', b.y);
    }

    function setNodePosition(group, point) {
      group.setAttribute('transform', `translate(${point.x} ${point.y})`);
    }

    function buildNodeGroup(pos, id, step) {
      const group = svgElement('g');
      group.setAttribute('class', pos.node.subtree ? 'subtree' : 'rotation-node');
      if (!pos.node.subtree && step.focus.includes(id)) group.classList.add('focus');
      if (id === step.tree.id) group.classList.add('root');

      if (pos.node.subtree) {
        const rect = svgElement('rect');
        rect.setAttribute('x', -SUBTREE_WIDTH / 2);
        rect.setAttribute('y', -SUBTREE_HEIGHT / 2);
        rect.setAttribute('width', SUBTREE_WIDTH);
        rect.setAttribute('height', SUBTREE_HEIGHT);
        rect.setAttribute('rx', 4);

        const text = svgElement('text');
        text.setAttribute('x', 0);
        text.setAttribute('y', 1);
        text.textContent = pos.node.label;

        group.appendChild(rect);
        group.appendChild(text);
      } else {
        const circle = svgElement('circle');
        circle.setAttribute('cx', 0);
        circle.setAttribute('cy', 0);
        circle.setAttribute('r', NODE_RADIUS);

        const text = svgElement('text');
        text.setAttribute('x', 0);
        text.setAttribute('y', 1);
        text.textContent = pos.node.label;

        group.appendChild(circle);
        group.appendChild(text);
      }

      return group;
    }

    function drawStaticTree(svg, step, layout) {
      svg.innerHTML = '';
      svg.setAttribute('viewBox', `0 0 ${layout.width} ${layout.height}`);

      layout.edges.forEach(([from, to]) => {
        const a = layout.positions.get(from);
        const b = layout.positions.get(to);
        const line = svgElement('line');
        setLinePosition(line, a, b);
        line.setAttribute('class', 'tree-edge');
        svg.appendChild(line);
      });

      layout.positions.forEach((pos, id) => {
        const group = buildNodeGroup(pos, id, step);
        setNodePosition(group, pos);
        svg.appendChild(group);
      });
    }

    function drawAnimatedTree(svg, step, fromLayout, toLayout, motionFocus) {
      if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);

      svg.innerHTML = '';
      svg.setAttribute('viewBox', `0 0 ${toLayout.width} ${toLayout.height}`);

      const oldEdges = new Map(fromLayout.edges.map(edge => [edgeKey(edge), edge]));
      const newEdges = new Map(toLayout.edges.map(edge => [edgeKey(edge), edge]));
      const motionPaths = buildMotionPaths(fromLayout, toLayout, motionFocus);
      const edgeMorphs = [];

      new Set([...oldEdges.keys(), ...newEdges.keys()]).forEach((key) => {
        const oldEdge = oldEdges.get(key);
        const newEdge = newEdges.get(key);
        const startEdge = oldEdge || newEdge;
        const endEdge = newEdge || oldEdge;
        const line = svgElement('line');
        line.setAttribute('class', 'tree-edge');
        line.style.opacity = oldEdge ? '1' : '0';
        svg.appendChild(line);
        edgeMorphs.push({
          line,
          start: startEdge,
          end: endEdge,
          fromOpacity: oldEdge ? 1 : 0,
          toOpacity: newEdge ? 1 : 0
        });
      });

      const nodeGroups = new Map();
      toLayout.positions.forEach((pos, id) => {
        const group = buildNodeGroup(pos, id, step);
        svg.appendChild(group);
        nodeGroups.set(id, group);
      });

      setAnimationBusy(true);
      const startTime = performance.now();

      function animate(now) {
        const raw = Math.min(1, (now - startTime) / ANIMATION_MS);
        const progress = easeInOutCubic(raw);

        edgeMorphs.forEach((morph) => {
          const edge = morph.toOpacity > morph.fromOpacity ? morph.end : morph.start;
          const a = positionAt(edge[0], motionPaths, progress);
          const b = positionAt(edge[1], motionPaths, progress);
          setLinePosition(morph.line, a, b);
          morph.line.style.opacity = morph.fromOpacity + (morph.toOpacity - morph.fromOpacity) * progress;
        });

        nodeGroups.forEach((group, id) => {
          setNodePosition(group, positionAt(id, motionPaths, progress));
        });

        if (raw < 1) {
          animationFrameId = requestAnimationFrame(animate);
          return;
        }

        animationFrameId = null;
        renderedLayout = toLayout;
        drawStaticTree(svg, step, toLayout);
        setAnimationBusy(false);
      }

      animationFrameId = requestAnimationFrame(animate);
    }

    function renderTree(step, animate = true, motionFocus = step.focus || []) {
      const svg = document.getElementById('rotationSvg');
      const layout = layoutTree(step.tree);

      if (!renderedLayout || !animate || prefersReducedMotion) {
        if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        renderedLayout = layout;
        drawStaticTree(svg, step, layout);
        setAnimationBusy(false);
        return;
      }

      drawAnimatedTree(svg, step, renderedLayout, layout, motionFocus);
    }

    function render(options = {}) {
      const { animate = true } = options;
      const step = steps[stepIndex];
      const motionFocus = options.motionFocus || step.motionFocus || step.focus || [];
      document.getElementById('caseTitle').textContent = step.title;
      document.getElementById('stepCount').textContent = `${stepIndex + 1} of ${steps.length}`;
      document.getElementById('status').textContent = step.message;
      document.getElementById('inorderBox').textContent = step.inorder;
      updateButtonStates();
      renderTree(step, animate, motionFocus);
    }

    function chooseCase(caseName) {
      currentCase = caseName;
      steps = caseBuilders[currentCase]();
      stepIndex = 0;
      renderedLayout = null;
      render({ animate: false });
    }

    document.querySelectorAll('[data-case]').forEach((button) => {
      button.addEventListener('click', () => {
        if (!isAnimating) chooseCase(button.dataset.case);
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (!isAnimating && stepIndex > 0) {
        const previousStep = steps[stepIndex];
        stepIndex--;
        render({ motionFocus: previousStep.motionFocus || previousStep.focus || [] });
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (!isAnimating && stepIndex < steps.length - 1) {
        stepIndex++;
        render({ motionFocus: steps[stepIndex].motionFocus || steps[stepIndex].focus || [] });
      }
    });

    chooseCase('left');
  </script>
</body>
</html>
