<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linked List Operations Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    #demoContainer h2 {
      padding-right: 120px;
    }
    .ll-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    #insertHeadBtn {
      margin-left: 18px;
    }
    .ll-controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .ll-controls input {
      width: 58px;
    }
    .ll-controls select {
      min-width: 88px;
    }
    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 6px 8px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
      line-height: 1.45;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      max-width: 900px;
      line-height: 1.6;
    }
    .ll-stage {
      max-width: 980px;
      overflow-x: auto;
      padding: 14px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .list-strip {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      min-height: 82px;
      min-width: max-content;
    }
    .state-line {
      display: grid;
      grid-template-columns: 58px minmax(max-content, 1fr);
      gap: 8px;
      align-items: start;
    }
    .state-line + .state-line {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #ddd;
    }
    .state-label {
      padding-top: 58px;
      color: #555;
      font-size: 12px;
      font-weight: bold;
      text-align: right;
    }
    .node-wrap,
    .null-wrap,
    .detached-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .role-label {
      display: flex;
      min-height: 44px;
      max-width: 78px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      color: #333;
      font-size: 11px;
      font-weight: bold;
      line-height: 1.25;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .null-token,
    .list-node {
      min-height: 36px;
      box-sizing: border-box;
    }
    .null-token {
      display: inline-flex;
      min-width: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border: 1px dashed #777;
      background: #f6f6f6;
      color: #555;
      font-size: 13px;
      font-family: Menlo, Consolas, monospace;
    }
    .pointer-marks {
      display: flex;
      min-height: 26px;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
    }
    .pointer-mark {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      color: #0a3974;
      font-family: Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }
    .pointer-down {
      position: relative;
      width: 2px;
      height: 9px;
      margin-top: 2px;
      background: currentColor;
    }
    .pointer-down::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
      transform: translateX(-50%);
    }
    .role-note {
      min-height: 14px;
    }
    .list-node {
      position: relative;
      display: inline-flex;
      min-width: 46px;
      max-width: 96px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 2px solid #333;
      background: #cce3ff;
      font-size: 14px;
      font-weight: bold;
    }
    .node-ref {
      position: absolute;
      top: -12px;
      right: -8px;
      min-width: 24px;
      padding: 1px 5px;
      border: 1px solid #0a3974;
      border-radius: 999px;
      background: #fff;
      color: #0a3974;
      font-family: Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
    }
    .node-value {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .list-node.inserted {
      background: #8ecae6;
      border-color: #0f5f78;
    }
    .list-node.reference,
    .list-node.prev {
      background: #ffe16a;
      border-color: #8a6d00;
    }
    .list-node.scanned {
      background: #f7d7a8;
      border-color: #9a5c00;
    }
    .list-node.found {
      background: #74b474;
      border-color: #245d24;
    }
    .list-node.successor {
      background: #d7d0ff;
      border-color: #5140a0;
    }
    .list-node.removed {
      background: #ffa088;
      border-color: #9d2a17;
    }
    .list-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-top: 59px;
      color: #555;
    }
    .list-arrow {
      position: relative;
      width: 28px;
      height: 10px;
      flex: 0 0 10px;
    }
    .list-arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 7px;
      top: 4px;
      border-top: 2px solid currentColor;
    }
    .list-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid currentColor;
    }
    .link-label {
      min-height: 14px;
      color: #555;
      font-size: 11px;
      text-align: center;
    }
    .list-link.changed {
      color: #2f855a;
    }
    .list-link.bypassed {
      color: #b3261e;
    }
    .detached-wrap {
      margin-left: 12px;
    }
    .detached-note {
      color: #555;
      font-size: 11px;
    }
    .ll-details {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(320px, 1fr);
      gap: 16px;
      max-width: 980px;
      margin-top: 12px;
      line-height: 1.5;
    }
    .result-box,
    .steps-box {
      padding: 10px 12px;
      border: 1px solid #777;
      background: #f6f6f6;
    }
    .result-box {
      display: grid;
      gap: 8px;
      border-left: 4px solid #4a768b;
    }
    .result-box.has-return {
      border-left-color: #2e7d32;
      background: #f4fbf4;
    }
    .result-box.has-error {
      border-left-color: #b3261e;
      background: #fff5f5;
    }
    .result-label {
      color: #555;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .return-display {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .return-word {
      font-weight: bold;
    }
    .return-value {
      display: inline-flex;
      min-width: 54px;
      min-height: 38px;
      max-width: 190px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #333;
      background: #74b474;
      color: #111;
      font-weight: bold;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .return-value.none {
      border-style: dashed;
      background: #fff;
      color: #555;
      font-weight: normal;
    }
    .return-value.error {
      background: #ffa088;
    }
    .facts {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .fact {
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .fact strong {
      margin-right: 4px;
    }
    .steps-box ol {
      margin: 6px 0 0 1.4em;
      padding: 0;
    }
    .steps-box li {
      margin: 4px 0;
    }
    @media (max-width: 760px) {
      .ll-details {
        grid-template-columns: 1fr;
      }
      .ll-stage {
        padding: 10px;
      }
    }
  </style>

<body class="no-tooltips">
  <div id="demoContainer">
    <h2>Linked List Operations Demo</h2>

    <div class="ll-controls">
      <label>v=<input id="valueInput" type="text" value="X"></label>
      <label>n=<select id="targetInput"></select></label>
      <button id="resetBtn">Reset</button>
      <button id="insertHeadBtn">insertAtHead(v)</button>
      <button id="deleteHeadBtn">deleteAtHead()</button>
      <button id="insertAfterBtn">insertAfter(n, v)</button>
      <button id="deleteAfterBtn">deleteAfter(n)</button>
      <button id="insertTailBtn">insertAtTail(v)</button>
      <button id="searchBtn">search(v)</button>
      <button id="traverseBtn">traverse()</button>
    </div>

    <div class="legend">
      <strong>Legend:</strong>
      <span class="legend-box" style="background:#8ecae6;"></span>inserted
      <span class="legend-box" style="background:#ffe16a;"></span>known reference
      <span class="legend-box" style="background:#f7d7a8;"></span>scanned
      <span class="legend-box" style="background:#74b474;"></span>found
      <span class="legend-box" style="background:#d7d0ff;"></span>new successor
      <span class="legend-box" style="background:#ffa088;"></span>removed
    </div>

    <div id="status"></div>
    <div class="ll-stage">
      <div class="state-line">
        <div class="state-label">Before</div>
        <div id="beforeListStrip" class="list-strip previous"></div>
      </div>
      <div class="state-line">
        <div class="state-label">Current</div>
        <div id="currentListStrip" class="list-strip current"></div>
      </div>
    </div>

    <div class="ll-details">
      <div>
        <div id="resultBox" class="result-box"></div>
        <div class="facts">
          <div class="fact"><strong>Head:</strong><span id="headValue"></span></div>
          <div class="fact"><strong>Tail:</strong><span id="tailValue"></span></div>
          <div class="fact"><strong>Size:</strong><span id="listSize"></span></div>
        </div>
      </div>
      <div id="stepsBox" class="steps-box"></div>
    </div>
  </div>

  <script>
    let items;
    let refs;
    let nextRefNumber;
    let marks;
    let detachedValue;
    let detachedRef;
    let result;
    let steps;
    let changedLinks;
    let bypassedLinks;
    let beforeView;

    function resetState() {
      items = ['A', 'B', 'C', 'D'];
      refs = ['r1', 'r2', 'r3', 'r4'];
      nextRefNumber = 5;
      marks = {};
      detachedValue = '';
      detachedRef = '';
      result = {
        word: 'returns',
        value: 'none',
        mode: 'none',
        note: 'No operation has been applied yet.'
      };
      steps = [
        'Each small r-label stands in for a node reference.',
        'head points to the first node.',
        'Each arrow represents a next field pointing to the following node.',
        'The last node has next = null.'
      ];
      changedLinks = {};
      bypassedLinks = {};
      beforeView = createView(items);
      render('Initial list. Use n to choose a node reference; operations change references, not the values inside existing nodes.');
    }

    function readValue() {
      return document.getElementById('valueInput').value.trim();
    }

    function readTargetRef() {
      return document.getElementById('targetInput').value.trim();
    }

    function allocateRef() {
      const ref = `r${nextRefNumber}`;
      nextRefNumber += 1;
      return ref;
    }

    function setResult(word, value, mode, note) {
      result = { word, value, mode, note };
    }

    function createView(itemList, viewMarks = {}, options = {}) {
      return {
        items: itemList.slice(),
        refs: options.refs ? options.refs.slice() : refs.slice(0, itemList.length),
        marks: viewMarks,
        detachedValue: options.detachedValue || '',
        detachedRef: options.detachedRef || '',
        changedLinks: options.changedLinks || {},
        bypassedLinks: options.bypassedLinks || {}
      };
    }

    function beforeSnapshot(viewMarks = {}, options = {}) {
      return {
        beforeItems: items.slice(),
        beforeRefs: refs.slice(),
        beforeMarks: viewMarks,
        beforeOptions: options
      };
    }

    function setState(message, newMarks, newSteps, options = {}) {
      beforeView = createView(
        options.beforeItems || items,
        options.beforeMarks || {},
        { ...(options.beforeOptions || {}), refs: options.beforeRefs || refs }
      );
      marks = newMarks || {};
      steps = newSteps || [];
      detachedValue = options.detachedValue || '';
      detachedRef = options.detachedRef || '';
      changedLinks = options.changedLinks || {};
      bypassedLinks = options.bypassedLinks || {};
      render(message);
    }

    function emptyInputMessage(kind) {
      setResult('returns', 'none', 'none', 'The operation was not attempted.');
      setState(`Enter a ${kind} before applying the operation.`, {}, [
        'The list is unchanged.'
      ]);
    }

    function markScanned(stopIndex) {
      const scanned = {};
      for (let i = 0; i < stopIndex; i++) {
        scanned[i] = { state: 'scanned', role: i === 0 ? 'cur' : '' };
      }
      return scanned;
    }

    function formatNode(index) {
      return index < 0 || index >= items.length ? 'null' : `${refs[index]} (${items[index]})`;
    }

    function headValue() {
      return formatNode(0);
    }

    function tailValue() {
      return formatNode(items.length - 1);
    }

    function render(message) {
      document.getElementById('status').textContent = message;
      document.getElementById('headValue').textContent = headValue();
      document.getElementById('tailValue').textContent = tailValue();
      document.getElementById('listSize').textContent = items.length;
      renderList();
      updateReferenceOptions();
      renderResult();
      renderSteps();
    }

    function updateReferenceOptions() {
      const select = document.getElementById('targetInput');
      const previous = select.value;
      select.innerHTML = '';

      refs.forEach((ref, index) => {
        const option = document.createElement('option');
        option.value = ref;
        option.textContent = `${ref} (${items[index]})`;
        select.appendChild(option);
      });

      select.disabled = refs.length === 0;
      if (refs.includes(previous)) {
        select.value = previous;
      } else if (refs.length > 0) {
        select.value = refs[Math.min(1, refs.length - 1)];
      }
    }

    function appendLink(parent, label, mode) {
      const link = document.createElement('div');
      link.className = mode ? `list-link ${mode}` : 'list-link';

      const arrow = document.createElement('div');
      arrow.className = 'list-arrow';

      const linkLabel = document.createElement('div');
      linkLabel.className = 'link-label';
      linkLabel.textContent = label || '';

      link.appendChild(arrow);
      link.appendChild(linkLabel);
      parent.appendChild(link);
    }

    function renderList() {
      renderListView(document.getElementById('beforeListStrip'), beforeView || createView(items));
      renderListView(document.getElementById('currentListStrip'), createView(items, marks, {
        detachedValue,
        detachedRef,
        changedLinks,
        bypassedLinks
      }));
    }

    function renderListView(strip, view) {
      strip.innerHTML = '';

      if (view.items.length === 0) {
        appendNull(strip, 'head/tail');
      } else {
        view.items.forEach((value, index) => {
          appendNode(strip, value, view.refs[index], index, view.marks[index], view.items.length);

          if (index < view.items.length - 1) {
            const hasChanged = Object.prototype.hasOwnProperty.call(view.changedLinks, index);
            const hasBypassed = Object.prototype.hasOwnProperty.call(view.bypassedLinks, index);
            const mode = hasChanged ? 'changed' : hasBypassed ? 'bypassed' : '';
            const label = hasChanged ? view.changedLinks[index] : hasBypassed ? view.bypassedLinks[index] : '';
            appendLink(strip, label, mode);
          } else {
            const hasChanged = Object.prototype.hasOwnProperty.call(view.changedLinks, index);
            appendLink(strip, hasChanged ? view.changedLinks[index] : '', hasChanged ? 'changed' : '');
            appendNull(strip, 'null');
          }
        });
      }

      if (view.detachedValue !== '') {
        appendDetached(strip, view.detachedValue, view.detachedRef);
      }
    }

    function appendNull(parent, roleText) {
      const wrap = document.createElement('div');
      wrap.className = 'null-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      role.textContent = roleText || '';

      const token = document.createElement('div');
      token.className = 'null-token';
      token.textContent = 'null';

      wrap.appendChild(role);
      wrap.appendChild(token);
      parent.appendChild(wrap);
    }

    function appendNode(parent, value, ref, index, mark, listLength) {
      const wrap = document.createElement('div');
      wrap.className = 'node-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      appendRoleLabel(role, index, mark, listLength);

      const node = document.createElement('div');
      node.className = 'list-node';
      if (mark && mark.state) {
        node.classList.add(mark.state);
      }

      const refToken = document.createElement('div');
      refToken.className = 'node-ref';
      refToken.textContent = ref;

      const valueCell = document.createElement('div');
      valueCell.className = 'node-value';
      valueCell.textContent = value;

      node.appendChild(refToken);
      node.appendChild(valueCell);
      wrap.appendChild(role);
      wrap.appendChild(node);
      parent.appendChild(wrap);
    }

    function appendDetached(parent, value, ref) {
      const wrap = document.createElement('div');
      wrap.className = 'detached-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      role.textContent = 'removed';

      const node = document.createElement('div');
      node.className = 'list-node removed';

      const refToken = document.createElement('div');
      refToken.className = 'node-ref';
      refToken.textContent = ref;

      const valueCell = document.createElement('div');
      valueCell.className = 'node-value';
      valueCell.textContent = value;

      const note = document.createElement('div');
      note.className = 'detached-note';
      note.textContent = 'detached node';

      node.appendChild(refToken);
      node.appendChild(valueCell);
      wrap.appendChild(role);
      wrap.appendChild(node);
      wrap.appendChild(note);
      parent.appendChild(wrap);
    }

    function appendRoleLabel(role, index, mark, listLength) {
      const pointerMarks = document.createElement('div');
      pointerMarks.className = 'pointer-marks';
      if (index === 0) {
        pointerMarks.appendChild(createPointerMark('head'));
      }
      if (index === listLength - 1) {
        pointerMarks.appendChild(createPointerMark('tail'));
      }

      const note = document.createElement('div');
      note.className = 'role-note';
      note.textContent = mark && mark.role ? mark.role : '';

      role.appendChild(pointerMarks);
      role.appendChild(note);
    }

    function createPointerMark(label) {
      const mark = document.createElement('div');
      mark.className = 'pointer-mark';

      const text = document.createElement('span');
      text.textContent = label;

      const arrow = document.createElement('span');
      arrow.className = 'pointer-down';

      mark.appendChild(text);
      mark.appendChild(arrow);
      return mark;
    }

    function renderResult() {
      const resultBox = document.getElementById('resultBox');
      resultBox.className =
        result.mode === 'error'
          ? 'result-box has-error'
          : result.mode === 'return'
            ? 'result-box has-return'
            : 'result-box';
      resultBox.innerHTML = '';

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = 'Result';
      resultBox.appendChild(label);

      const display = document.createElement('div');
      display.className = 'return-display';

      const word = document.createElement('span');
      word.className = 'return-word';
      word.textContent = result.word;
      display.appendChild(word);

      const value = document.createElement('span');
      value.className = result.mode === 'error' ? 'return-value error' : result.mode === 'none' ? 'return-value none' : 'return-value';
      value.textContent = result.value;
      display.appendChild(value);

      resultBox.appendChild(display);

      const note = document.createElement('div');
      note.textContent = result.note;
      resultBox.appendChild(note);
    }

    function renderSteps() {
      const box = document.getElementById('stepsBox');
      box.innerHTML = '';

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = 'Operation Steps';
      box.appendChild(label);

      const list = document.createElement('ol');
      steps.forEach((step) => {
        const item = document.createElement('li');
        item.textContent = step;
        list.appendChild(item);
      });
      box.appendChild(list);
    }

    document.getElementById('insertHeadBtn').addEventListener('click', () => {
      const value = readValue();
      if (value === '') {
        emptyInputMessage('value');
        return;
      }

      const previousHead = items.length === 0 ? 'null' : formatNode(0);
      const before = beforeSnapshot();
      const newRef = allocateRef();
      items.unshift(value);
      refs.unshift(newRef);
      setResult('returns', 'none', 'none', 'The operation changes the head reference.');

      const newMarks = {
        0: { state: 'inserted', role: 'new' }
      };
      if (items.length > 1) {
        newMarks[1] = { state: 'successor', role: '' };
      }

      setState(`insertAtHead(${value}) makes ${value} the first node.`, newMarks, [
        `Create a new node ${newRef} storing ${value}.`,
        `Set newNode.next to the previous first node (${previousHead}).`,
        `Set head to the new node ${newRef}.`
      ], {
        ...before,
        changedLinks: { 0: `next = ${previousHead === 'null' ? 'null' : before.beforeRefs[0]}` }
      });
    });

    document.getElementById('deleteHeadBtn').addEventListener('click', () => {
      if (items.length === 0) {
        setResult('returns', 'none', 'error', 'There is no head node to remove.');
        setState('deleteAtHead() cannot remove from an empty list.', {}, [
          'head is null.',
          'There is no first node to detach.',
          'The list is unchanged.'
        ]);
        return;
      }

      const removed = items[0];
      const removedRef = refs[0];
      const newHead = items.length > 1 ? formatNode(1) : 'null';
      const before = beforeSnapshot({
        0: { state: 'removed', role: 'remove' }
      });
      items.shift();
      refs.shift();

      const newMarks = {};
      if (items.length > 0) {
        newMarks[0] = { state: 'successor', role: '' };
      }

      setResult('returns', removed, 'return', 'The removed node is detached from the list.');
      setState(`deleteAtHead() removes ${removedRef}, the node storing ${removed}.`, newMarks, [
        `Save the value from the first node ${removedRef} (${removed}).`,
        `Set head to the next node (${newHead}).`,
        `Return ${removed}.`
      ], {
        ...before,
        detachedValue: removed,
        detachedRef: removedRef
      });
    });

    document.getElementById('insertAfterBtn').addEventListener('click', () => {
      const value = readValue();
      const targetRef = readTargetRef();
      if (value === '') {
        emptyInputMessage('value');
        return;
      }
      if (targetRef === '') {
        emptyInputMessage('node reference');
        return;
      }

      const targetIndex = refs.indexOf(targetRef);
      if (targetIndex === -1) {
        setResult('returns', 'none', 'none', 'No reference node was available.');
        setState(`The selected reference ${targetRef} is not in the list, so insertAfter changes nothing.`, {}, [
          'The operation needs a reference to a node already in the list.',
          'No selected reference is available in the current list.',
          'The list is unchanged.'
        ]);
        return;
      }

      const targetValue = items[targetIndex];
      const oldSuccessorRef = targetIndex + 1 < refs.length ? refs[targetIndex + 1] : 'null';
      const oldSuccessor = targetIndex + 1 < items.length ? formatNode(targetIndex + 1) : 'null';
      const beforeMarks = {
        [targetIndex]: { state: 'reference', role: 'n' }
      };
      if (targetIndex + 1 < items.length) {
        beforeMarks[targetIndex + 1] = { state: 'successor', role: '' };
      }
      const before = beforeSnapshot(beforeMarks);
      const newRef = allocateRef();
      items.splice(targetIndex + 1, 0, value);
      refs.splice(targetIndex + 1, 0, newRef);

      const newMarks = {
        [targetIndex]: { state: 'reference', role: 'n' },
        [targetIndex + 1]: { state: 'inserted', role: 'new' }
      };
      if (targetIndex + 2 < items.length) {
        newMarks[targetIndex + 2] = { state: 'successor', role: '' };
      }

      setResult('returns', 'none', 'none', 'The operation uses n as a node reference, not as a value to search for.');
      setState(`insertAfter(${targetRef}, ${value}) inserts ${newRef} immediately after ${targetRef}.`, newMarks, [
        `n is the reference ${targetRef}, the node storing ${targetValue}.`,
        `Save the old successor of ${targetRef}: ${oldSuccessor}.`,
        `Set ${newRef}.next to ${oldSuccessorRef}.`,
        `Set ${targetRef}.next to ${newRef}.`
      ], {
        ...before,
        changedLinks: { [targetIndex]: `next = ${newRef}`, [targetIndex + 1]: `next = ${oldSuccessorRef}` }
      });
    });

    document.getElementById('deleteAfterBtn').addEventListener('click', () => {
      const targetRef = readTargetRef();
      if (targetRef === '') {
        emptyInputMessage('node reference');
        return;
      }

      const targetIndex = refs.indexOf(targetRef);
      if (targetIndex === -1) {
        setResult('returns', 'none', 'none', 'No predecessor/reference node was available.');
        setState(`The selected reference ${targetRef} is not in the list, so deleteAfter changes nothing.`, {}, [
          'The operation needs a reference to the predecessor node.',
          'No selected predecessor reference is available in the current list.',
          'The list is unchanged.'
        ]);
        return;
      }

      if (targetIndex === items.length - 1) {
        setResult('returns', 'none', 'error', 'There is no node after the selected reference.');
        setState(`${targetRef} has no successor, so deleteAfter cannot remove a node.`, {
          [targetIndex]: { state: 'reference', role: 'n' }
        }, [
          `${targetRef}.next is null.`,
          'There is no successor node to bypass.',
          'The list is unchanged.'
        ]);
        return;
      }

      const removed = items[targetIndex + 1];
      const removedRef = refs[targetIndex + 1];
      const newSuccessorRef = targetIndex + 2 < refs.length ? refs[targetIndex + 2] : 'null';
      const newSuccessor = targetIndex + 2 < items.length ? formatNode(targetIndex + 2) : 'null';
      const before = beforeSnapshot({
        [targetIndex]: { state: 'reference', role: 'n' },
        [targetIndex + 1]: { state: 'removed', role: 'remove' }
      });
      items.splice(targetIndex + 1, 1);
      refs.splice(targetIndex + 1, 1);

      const newMarks = {
        [targetIndex]: { state: 'reference', role: 'n' }
      };
      if (targetIndex + 1 < items.length) {
        newMarks[targetIndex + 1] = { state: 'successor', role: '' };
      }

      setResult('returns', removed, 'return', 'The bypassed node is detached from the list.');
      setState(`deleteAfter(${targetRef}) removes ${removedRef}, the node that came after ${targetRef}.`, newMarks, [
        `n is the reference ${targetRef}.`,
        `oldNode = ${targetRef}.next, which is ${removedRef} and stores ${removed}.`,
        `Set ${targetRef}.next to oldNode.next (${newSuccessor}).`,
        `Return ${removed}.`
      ], {
        ...before,
        detachedValue: removed,
        detachedRef: removedRef,
        changedLinks: { [targetIndex]: `next = ${newSuccessorRef}` }
      });
    });

    document.getElementById('insertTailBtn').addEventListener('click', () => {
      const value = readValue();
      if (value === '') {
        emptyInputMessage('value');
        return;
      }

      const oldTailIndex = items.length - 1;
      const oldTail = oldTailIndex >= 0 ? formatNode(oldTailIndex) : 'null';
      const before = beforeSnapshot(
        oldTailIndex >= 0 ? { [oldTailIndex]: { state: 'reference', role: '' } } : {}
      );
      const newRef = allocateRef();
      items.push(value);
      refs.push(newRef);

      const newMarks = {
        [items.length - 1]: { state: 'inserted', role: 'new' }
      };
      if (oldTailIndex >= 0) {
        newMarks[oldTailIndex] = { state: 'reference', role: '' };
      }

      setResult('returns', 'none', 'none', 'The operation appends one new node at the end of the chain.');

      if (oldTailIndex === -1) {
        setState(`insertAtTail(${value}) creates the first node.`, newMarks, [
          `Create a new node ${newRef} storing ${value}.`,
          'Set head to the new node.',
          'Set tail to the new node.'
        ], {
          ...before
        });
        return;
      }

      setState(`insertAtTail(${value}) appends ${newRef} after the tail node ${oldTail}.`, newMarks, [
        `Create a new node ${newRef} storing ${value}.`,
        `Set ${refs[oldTailIndex]}.next to ${newRef}.`,
        `Set tail to the new node ${newRef}.`
      ], {
        ...before,
        changedLinks: { [oldTailIndex]: `next = ${newRef}` }
      });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const target = readValue();
      if (target === '') {
        emptyInputMessage('value');
        return;
      }

      const targetIndex = items.indexOf(target);
      if (targetIndex === -1) {
        setResult('returns', 'null', 'return', 'The traversal reached the end without a match.');
        setState(`search(${target}) reaches null without finding ${target}.`, markScanned(items.length), [
          'Start cur at head.',
          `Compare each visited node with ${target}.`,
          'cur becomes null, so return null.'
        ]);
        return;
      }

      const newMarks = markScanned(targetIndex);
      newMarks[targetIndex] = { state: 'found', role: 'cur found' };

      setResult('returns', `node ${refs[targetIndex]}`, 'return', 'The returned reference points to the first matching node.');
      setState(`search(${target}) returns ${refs[targetIndex]}, the first node storing ${target}.`, newMarks, [
        'Start cur at head.',
        `Advance cur until a node stores ${target}.`,
        `Return a reference to that node: ${refs[targetIndex]}.`
      ]);
    });

    document.getElementById('traverseBtn').addEventListener('click', () => {
      if (items.length === 0) {
        setResult('visits', 'none', 'none', 'Traversal stops immediately because head is null.');
        setState('traverse() visits no nodes in an empty list.', {}, [
          'Start cur at head.',
          'head is null, so the traversal is finished.'
        ]);
        return;
      }

      const path = items.map((value, index) => `${refs[index]}:${value}`).join(' -> ');
      setResult('visits', path, 'return', 'The nodes are visited in link order.');
      setState(`traverse() visits ${path}.`, markScanned(items.length), [
        'Start cur at head.',
        'Visit the current node, then follow cur.next.',
        'Stop when cur becomes null.'
      ]);
    });

    document.getElementById('resetBtn').addEventListener('click', resetState);

    resetState();
  </script>
</body>
</html>
