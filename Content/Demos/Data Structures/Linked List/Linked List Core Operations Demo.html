<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Linked List Core Operations Demo</title>
  <script src="../../../../scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="../../../../css/style.css">
  <link rel="stylesheet" href="../../../../css/demo.css">
  <style>
    #demoContainer h2 {
      padding-right: 120px;
    }
    .ll-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .ll-controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .ll-controls input {
      width: 92px;
    }
    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 6px 8px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
      line-height: 1.45;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      max-width: 900px;
      line-height: 1.6;
    }
    .ll-stage {
      max-width: 980px;
      overflow-x: auto;
      padding: 14px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .list-strip {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-height: 94px;
      min-width: max-content;
    }
    .pointer-wrap,
    .node-wrap,
    .null-wrap,
    .detached-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .role-label {
      min-height: 32px;
      max-width: 104px;
      color: #333;
      font-size: 12px;
      font-weight: bold;
      line-height: 1.25;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .pointer-token,
    .null-token,
    .list-node {
      min-height: 46px;
      box-sizing: border-box;
    }
    .pointer-token,
    .null-token {
      display: inline-flex;
      min-width: 58px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px dashed #777;
      background: #f6f6f6;
      color: #555;
      font-family: Menlo, Consolas, monospace;
    }
    .pointer-token.changed {
      border-style: solid;
      border-color: #2f855a;
      background: #e8f7ed;
      color: #111;
      font-weight: bold;
    }
    .list-node {
      display: grid;
      grid-template-columns: minmax(46px, auto) 48px;
      min-width: 104px;
      max-width: 180px;
      border: 2px solid #333;
      background: #cce3ff;
      font-weight: bold;
    }
    .node-value,
    .node-next {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 8px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .node-next {
      border-left: 2px solid #333;
      color: #333;
      font-size: 12px;
      font-weight: normal;
    }
    .list-node.inserted {
      background: #8ecae6;
      border-color: #0f5f78;
    }
    .list-node.reference,
    .list-node.prev {
      background: #ffe16a;
      border-color: #8a6d00;
    }
    .list-node.scanned {
      background: #f7d7a8;
      border-color: #9a5c00;
    }
    .list-node.found {
      background: #74b474;
      border-color: #245d24;
    }
    .list-node.successor {
      background: #d7d0ff;
      border-color: #5140a0;
    }
    .list-node.removed {
      background: #ffa088;
      border-color: #9d2a17;
    }
    .list-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-top: 36px;
      color: #555;
    }
    .list-arrow {
      min-width: 24px;
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
      text-align: center;
    }
    .link-label {
      min-height: 14px;
      color: #555;
      font-size: 11px;
      text-align: center;
    }
    .list-link.changed {
      color: #2f855a;
    }
    .list-link.bypassed {
      color: #b3261e;
    }
    .detached-wrap {
      margin-left: 24px;
    }
    .detached-note {
      color: #555;
      font-size: 11px;
    }
    .ll-details {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(320px, 1fr);
      gap: 16px;
      max-width: 980px;
      margin-top: 12px;
      line-height: 1.5;
    }
    .result-box,
    .steps-box {
      padding: 10px 12px;
      border: 1px solid #777;
      background: #f6f6f6;
    }
    .result-box {
      display: grid;
      gap: 8px;
      border-left: 4px solid #4a768b;
    }
    .result-box.has-return {
      border-left-color: #2e7d32;
      background: #f4fbf4;
    }
    .result-box.has-error {
      border-left-color: #b3261e;
      background: #fff5f5;
    }
    .result-label {
      color: #555;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .return-display {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .return-word {
      font-weight: bold;
    }
    .return-value {
      display: inline-flex;
      min-width: 54px;
      min-height: 38px;
      max-width: 190px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #333;
      background: #74b474;
      color: #111;
      font-weight: bold;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .return-value.none {
      border-style: dashed;
      background: #fff;
      color: #555;
      font-weight: normal;
    }
    .return-value.error {
      background: #ffa088;
    }
    .facts {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .fact {
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .fact strong {
      margin-right: 4px;
    }
    .steps-box ol {
      margin: 6px 0 0 1.4em;
      padding: 0;
    }
    .steps-box li {
      margin: 4px 0;
    }
    @media (max-width: 760px) {
      .ll-details {
        grid-template-columns: 1fr;
      }
      .ll-stage {
        padding: 10px;
      }
    }
  </style>

<body class="no-tooltips">
  <div id="demoContainer">
    <h2>Linked List Core Operations Demo</h2>

    <div class="ll-controls">
      <label>Value <input id="valueInput" type="text" value="X"></label>
      <label>Target <input id="targetInput" type="text" value="B"></label>
      <button id="insertHeadBtn">Insert at Head</button>
      <button id="insertAfterBtn">Insert After</button>
      <button id="deleteAfterBtn">Delete After</button>
      <button id="findBtn">Search/Find</button>
      <button id="deleteFirstBtn">DeleteFirst</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="legend">
      <strong>Legend:</strong>
      <span class="legend-box" style="background:#8ecae6;"></span>inserted
      <span class="legend-box" style="background:#ffe16a;"></span>known reference
      <span class="legend-box" style="background:#f7d7a8;"></span>scanned
      <span class="legend-box" style="background:#74b474;"></span>found
      <span class="legend-box" style="background:#d7d0ff;"></span>new successor
      <span class="legend-box" style="background:#ffa088;"></span>removed
    </div>

    <div id="status"></div>
    <div class="ll-stage">
      <div id="listStrip" class="list-strip"></div>
    </div>

    <div class="ll-details">
      <div>
        <div id="resultBox" class="result-box"></div>
        <div class="facts">
          <div class="fact"><strong>Head:</strong><span id="headValue"></span></div>
          <div class="fact"><strong>Tail:</strong><span id="tailValue"></span></div>
          <div class="fact"><strong>Size:</strong><span id="listSize"></span></div>
        </div>
      </div>
      <div id="stepsBox" class="steps-box"></div>
    </div>
  </div>

  <script>
    let items;
    let marks;
    let detachedValue;
    let result;
    let steps;
    let changedHead;
    let changedLinks;
    let bypassedLinks;

    function resetState() {
      items = ['A', 'B', 'C', 'D'];
      marks = {};
      detachedValue = '';
      result = {
        word: 'returns',
        value: 'none',
        mode: 'none',
        note: 'No operation has been applied yet.'
      };
      steps = [
        'head points to the first node.',
        'Each next field points to the following node.',
        'The last node has next = null.'
      ];
      changedHead = false;
      changedLinks = {};
      bypassedLinks = {};
      render('Initial list. Operations change references; the values inside existing nodes do not shift.');
    }

    function readValue() {
      return document.getElementById('valueInput').value.trim();
    }

    function readTarget() {
      return document.getElementById('targetInput').value.trim();
    }

    function setResult(word, value, mode, note) {
      result = { word, value, mode, note };
    }

    function setState(message, newMarks, newSteps, options = {}) {
      marks = newMarks || {};
      steps = newSteps || [];
      detachedValue = options.detachedValue || '';
      changedHead = Boolean(options.changedHead);
      changedLinks = options.changedLinks || {};
      bypassedLinks = options.bypassedLinks || {};
      render(message);
    }

    function emptyInputMessage(kind) {
      setResult('returns', 'none', 'none', 'The operation was not attempted.');
      setState(`Enter a ${kind} before applying the operation.`, {}, [
        'The list is unchanged.'
      ]);
    }

    function markScanned(stopIndex) {
      const scanned = {};
      for (let i = 0; i < stopIndex; i++) {
        scanned[i] = { state: 'scanned', role: i === 0 ? 'cur starts here' : 'cur visited' };
      }
      return scanned;
    }

    function headValue() {
      return items.length === 0 ? 'null' : items[0];
    }

    function tailValue() {
      return items.length === 0 ? 'null' : items[items.length - 1];
    }

    function render(message) {
      document.getElementById('status').textContent = message;
      document.getElementById('headValue').textContent = headValue();
      document.getElementById('tailValue').textContent = tailValue();
      document.getElementById('listSize').textContent = items.length;
      renderList();
      renderResult();
      renderSteps();
    }

    function appendLink(parent, label, mode) {
      const link = document.createElement('div');
      link.className = mode ? `list-link ${mode}` : 'list-link';

      const arrow = document.createElement('div');
      arrow.className = 'list-arrow';
      arrow.textContent = '->';

      const linkLabel = document.createElement('div');
      linkLabel.className = 'link-label';
      linkLabel.textContent = label || '';

      link.appendChild(arrow);
      link.appendChild(linkLabel);
      parent.appendChild(link);
    }

    function renderList() {
      const strip = document.getElementById('listStrip');
      strip.innerHTML = '';

      const pointerWrap = document.createElement('div');
      pointerWrap.className = 'pointer-wrap';

      const pointerRole = document.createElement('div');
      pointerRole.className = 'role-label';
      pointerRole.textContent = changedHead ? 'updated' : '';

      const pointer = document.createElement('div');
      pointer.className = changedHead ? 'pointer-token changed' : 'pointer-token';
      pointer.textContent = 'head';

      pointerWrap.appendChild(pointerRole);
      pointerWrap.appendChild(pointer);
      strip.appendChild(pointerWrap);

      appendLink(strip, changedHead ? 'new head' : '', changedHead ? 'changed' : '');

      if (items.length === 0) {
        appendNull(strip, 'empty');
      } else {
        items.forEach((value, index) => {
          appendNode(strip, value, index, marks[index]);

          if (index < items.length - 1) {
            const mode = changedLinks[index] ? 'changed' : bypassedLinks[index] ? 'bypassed' : '';
            const label = changedLinks[index] || bypassedLinks[index] || '';
            appendLink(strip, label, mode);
          } else {
            appendLink(strip, changedLinks[index] || '', changedLinks[index] ? 'changed' : '');
            appendNull(strip, 'null');
          }
        });
      }

      if (detachedValue !== '') {
        appendDetached(strip, detachedValue);
      }
    }

    function appendNull(parent, roleText) {
      const wrap = document.createElement('div');
      wrap.className = 'null-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      role.textContent = roleText || '';

      const token = document.createElement('div');
      token.className = 'null-token';
      token.textContent = 'null';

      wrap.appendChild(role);
      wrap.appendChild(token);
      parent.appendChild(wrap);
    }

    function appendNode(parent, value, index, mark) {
      const wrap = document.createElement('div');
      wrap.className = 'node-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      role.textContent = roleText(index, mark);

      const node = document.createElement('div');
      node.className = 'list-node';
      if (mark && mark.state) {
        node.classList.add(mark.state);
      }

      const valueCell = document.createElement('div');
      valueCell.className = 'node-value';
      valueCell.textContent = value;

      const nextCell = document.createElement('div');
      nextCell.className = 'node-next';
      nextCell.textContent = 'next';

      node.appendChild(valueCell);
      node.appendChild(nextCell);
      wrap.appendChild(role);
      wrap.appendChild(node);
      parent.appendChild(wrap);
    }

    function appendDetached(parent, value) {
      const wrap = document.createElement('div');
      wrap.className = 'detached-wrap';

      const role = document.createElement('div');
      role.className = 'role-label';
      role.textContent = 'removed';

      const node = document.createElement('div');
      node.className = 'list-node removed';

      const valueCell = document.createElement('div');
      valueCell.className = 'node-value';
      valueCell.textContent = value;

      const nextCell = document.createElement('div');
      nextCell.className = 'node-next';
      nextCell.textContent = 'old';

      const note = document.createElement('div');
      note.className = 'detached-note';
      note.textContent = 'detached node';

      node.appendChild(valueCell);
      node.appendChild(nextCell);
      wrap.appendChild(role);
      wrap.appendChild(node);
      wrap.appendChild(note);
      parent.appendChild(wrap);
    }

    function roleText(index, mark) {
      const roles = [];
      if (items.length === 1) {
        roles.push('head/tail');
      } else if (index === 0) {
        roles.push('head');
      } else if (index === items.length - 1) {
        roles.push('tail');
      }

      if (mark && mark.role) {
        roles.push(mark.role);
      }

      return roles.join(' / ');
    }

    function renderResult() {
      const resultBox = document.getElementById('resultBox');
      resultBox.className =
        result.mode === 'error'
          ? 'result-box has-error'
          : result.mode === 'return'
            ? 'result-box has-return'
            : 'result-box';
      resultBox.innerHTML = '';

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = 'Result';
      resultBox.appendChild(label);

      const display = document.createElement('div');
      display.className = 'return-display';

      const word = document.createElement('span');
      word.className = 'return-word';
      word.textContent = result.word;
      display.appendChild(word);

      const value = document.createElement('span');
      value.className = result.mode === 'error' ? 'return-value error' : result.mode === 'none' ? 'return-value none' : 'return-value';
      value.textContent = result.value;
      display.appendChild(value);

      resultBox.appendChild(display);

      const note = document.createElement('div');
      note.textContent = result.note;
      resultBox.appendChild(note);
    }

    function renderSteps() {
      const box = document.getElementById('stepsBox');
      box.innerHTML = '';

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = 'Reference Updates';
      box.appendChild(label);

      const list = document.createElement('ol');
      steps.forEach((step) => {
        const item = document.createElement('li');
        item.textContent = step;
        list.appendChild(item);
      });
      box.appendChild(list);
    }

    document.getElementById('insertHeadBtn').addEventListener('click', () => {
      const value = readValue();
      if (value === '') {
        emptyInputMessage('value');
        return;
      }

      const oldHead = items.length === 0 ? 'null' : items[0];
      items.unshift(value);
      setResult('returns', 'none', 'none', 'The operation changes the head reference.');

      const newMarks = {
        0: { state: 'inserted', role: 'new node' }
      };
      if (items.length > 1) {
        newMarks[1] = { state: 'successor', role: 'old head' };
      }

      setState(`insertAtHead(${value}) makes ${value} the first node.`, newMarks, [
        `Create a new node storing ${value}.`,
        `Set newNode.next to the old head (${oldHead}).`,
        `Set head to the new node (${value}).`
      ], {
        changedHead: true,
        changedLinks: { 0: 'old head' }
      });
    });

    document.getElementById('insertAfterBtn').addEventListener('click', () => {
      const value = readValue();
      const target = readTarget();
      if (value === '') {
        emptyInputMessage('value');
        return;
      }
      if (target === '') {
        emptyInputMessage('target');
        return;
      }

      const targetIndex = items.indexOf(target);
      if (targetIndex === -1) {
        setResult('returns', 'none', 'none', 'No reference node was available.');
        setState(`No node storing ${target} is present, so insertAfter changes nothing.`, {}, [
          'The operation needs a reference to a node already in the list.',
          'No matching node is available in the current list.',
          'The list is unchanged.'
        ]);
        return;
      }

      const oldSuccessor = targetIndex + 1 < items.length ? items[targetIndex + 1] : 'null';
      items.splice(targetIndex + 1, 0, value);

      const newMarks = {
        [targetIndex]: { state: 'reference', role: 'node' },
        [targetIndex + 1]: { state: 'inserted', role: 'new node' }
      };
      if (targetIndex + 2 < items.length) {
        newMarks[targetIndex + 2] = { state: 'successor', role: 'old next' };
      }

      setResult('returns', 'none', 'none', 'The operation splices one new node into the chain.');
      setState(`insertAfter(node storing ${target}, ${value}) inserts ${value} immediately after ${target}.`, newMarks, [
        `Save the old successor of ${target}: ${oldSuccessor}.`,
        `Set newNode.next to ${oldSuccessor}.`,
        `Set ${target}.next to the new node (${value}).`
      ], {
        changedLinks: { [targetIndex]: 'new node', [targetIndex + 1]: oldSuccessor }
      });
    });

    document.getElementById('deleteAfterBtn').addEventListener('click', () => {
      const target = readTarget();
      if (target === '') {
        emptyInputMessage('target');
        return;
      }

      const targetIndex = items.indexOf(target);
      if (targetIndex === -1) {
        setResult('returns', 'none', 'none', 'No predecessor/reference node was available.');
        setState(`No node storing ${target} is present, so deleteAfter changes nothing.`, {}, [
          'The operation needs a reference to the predecessor node.',
          'No matching predecessor is available in the current list.',
          'The list is unchanged.'
        ]);
        return;
      }

      if (targetIndex === items.length - 1) {
        setResult('returns', 'none', 'error', 'There is no node after the selected reference.');
        setState(`The node storing ${target} has no successor, so deleteAfter cannot remove a node.`, {
          [targetIndex]: { state: 'reference', role: 'node' }
        }, [
          `${target}.next is null.`,
          'There is no successor node to bypass.',
          'The list is unchanged.'
        ]);
        return;
      }

      const removed = items[targetIndex + 1];
      const newSuccessor = targetIndex + 2 < items.length ? items[targetIndex + 2] : 'null';
      items.splice(targetIndex + 1, 1);

      const newMarks = {
        [targetIndex]: { state: 'reference', role: 'prev' }
      };
      if (targetIndex + 1 < items.length) {
        newMarks[targetIndex + 1] = { state: 'successor', role: 'new next' };
      }

      setResult('returns', removed, 'return', 'The bypassed node is detached from the list.');
      setState(`deleteAfter(node storing ${target}) removes the node that came after ${target}.`, newMarks, [
        `oldNode = ${target}.next, which stores ${removed}.`,
        `Set ${target}.next to oldNode.next (${newSuccessor}).`,
        `Return ${removed}.`
      ], {
        detachedValue: removed,
        changedLinks: { [targetIndex]: newSuccessor }
      });
    });

    document.getElementById('findBtn').addEventListener('click', () => {
      const target = readTarget();
      if (target === '') {
        emptyInputMessage('target');
        return;
      }

      const targetIndex = items.indexOf(target);
      if (targetIndex === -1) {
        setResult('returns', 'null', 'return', 'The traversal reached the end without a match.');
        setState(`find(${target}) reaches null without finding ${target}.`, markScanned(items.length), [
          'Start cur at head.',
          `Compare each visited node with ${target}.`,
          'cur becomes null, so return null.'
        ]);
        return;
      }

      const newMarks = markScanned(targetIndex);
      newMarks[targetIndex] = { state: 'found', role: 'cur found' };

      setResult('returns', `node ${target}`, 'return', 'The returned reference points to the matching node.');
      setState(`find(${target}) returns the first node storing ${target}.`, newMarks, [
        'Start cur at head.',
        `Advance cur until a node stores ${target}.`,
        `Return a reference to the node storing ${target}.`
      ]);
    });

    document.getElementById('deleteFirstBtn').addEventListener('click', () => {
      const target = readTarget();
      if (target === '') {
        emptyInputMessage('target');
        return;
      }

      const targetIndex = items.indexOf(target);
      if (targetIndex === -1) {
        setResult('returns', 'false', 'return', 'No node was removed.');
        setState(`deleteFirst(${target}) scans the list and finds no matching node.`, markScanned(items.length), [
          'Start prev at null and cur at head.',
          `Advance prev and cur while cur does not store ${target}.`,
          'cur becomes null, so return false.'
        ]);
        return;
      }

      const removed = items[targetIndex];

      if (targetIndex === 0) {
        const newHead = items.length > 1 ? items[1] : 'null';
        items.shift();

        const newMarks = {};
        if (items.length > 0) {
          newMarks[0] = { state: 'successor', role: 'new head' };
        }

        setResult('returns', 'true', 'return', `The node storing ${removed} was removed.`);
        setState(`deleteFirst(${target}) removes the head node.`, newMarks, [
          `cur starts at head and already stores ${target}.`,
          `Set head to head.next (${newHead}).`,
          'Return true.'
        ], {
          detachedValue: removed,
          changedHead: true
        });
        return;
      }

      const prevValue = items[targetIndex - 1];
      const newSuccessor = targetIndex + 1 < items.length ? items[targetIndex + 1] : 'null';
      items.splice(targetIndex, 1);

      const newMarks = markScanned(targetIndex - 1);
      newMarks[targetIndex - 1] = { state: 'prev', role: 'prev' };
      if (targetIndex < items.length) {
        newMarks[targetIndex] = { state: 'successor', role: 'new next' };
      }

      const updateTailStep = newSuccessor === 'null'
        ? 'If a tail reference is stored, update tail to prev.'
        : 'The tail reference is unchanged.';

      setResult('returns', 'true', 'return', `The first node storing ${removed} was removed.`);
      setState(`deleteFirst(${target}) bypasses the first matching node.`, newMarks, [
        `Traverse with prev and cur until cur stores ${target}.`,
        `Set ${prevValue}.next to cur.next (${newSuccessor}).`,
        updateTailStep,
        'Return true.'
      ], {
        detachedValue: removed,
        changedLinks: { [targetIndex - 1]: newSuccessor }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', resetState);

    resetState();
  </script>
</body>
</html>
