<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/DAIADS/scripts/content-page-routing.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priority Queue Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    #demoContainer h2 {
      padding-right: 120px;
    }

    .pq-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .pq-controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pq-controls input {
      box-sizing: border-box;
      min-height: 30px;
    }

    #valueInput {
      width: 72px;
    }

    #priorityInput {
      width: 76px;
    }

    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 7px 10px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
      line-height: 1.45;
    }

    .pq-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(220px, 300px);
      gap: 16px;
      align-items: stretch;
      max-width: 1040px;
    }

    .pq-stage {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid #9eb2c5;
      border-radius: 10px;
      background: #f7fbff;
      overflow: hidden;
    }

    #pqSvg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-label {
      fill: #334e68;
      font-family: "Segoe UI", Verdana, sans-serif;
      font-size: 14px;
    }

    .entry circle {
      fill: #cce3ff;
      stroke: #274c77;
      stroke-width: 2;
      transition: fill 180ms ease, stroke-width 180ms ease;
    }

    .entry text {
      fill: #102a43;
      font-family: "Segoe UI", Verdana, sans-serif;
      font-size: 18px;
      font-weight: 700;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .entry.next circle {
      stroke: #d9822b;
      stroke-width: 4;
    }

    .entry.inserted circle {
      fill: #8ecae6;
    }

    .entry.peeked circle {
      fill: #ffe16a;
      stroke: #8a5a00;
      stroke-width: 4;
    }

    .next-label {
      fill: #7a3b00;
      font-family: "Segoe UI", Verdana, sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
    }

    .empty-message {
      fill: #526777;
      font-family: "Segoe UI", Verdana, sans-serif;
      font-size: 18px;
      font-style: italic;
      text-anchor: middle;
    }

    .pq-notes {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .result-box,
    .fact {
      padding: 10px 12px;
      border: 1px solid #aebdca;
      background: #fff;
      line-height: 1.45;
    }

    .result-box {
      display: grid;
      gap: 8px;
      border-left: 4px solid #777;
      background: #f6f6f6;
    }

    .result-box.has-return {
      border-left-color: #2e7d32;
      background: #f4fbf4;
    }

    .result-box.has-error {
      border-left-color: #b3261e;
      background: #fff5f5;
    }

    .result-label {
      color: #555;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .return-value {
      display: inline-flex;
      min-width: 76px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      justify-self: start;
      padding: 0 12px;
      border: 1px solid #333;
      border-radius: 22px;
      background: #74b474;
      color: #111;
      font-weight: 700;
      box-sizing: border-box;
    }

    .return-value.none {
      border-style: dashed;
      border-radius: 4px;
      background: #fff;
      color: #555;
      font-weight: 400;
    }

    .return-value.error {
      border-radius: 4px;
      background: #ffa088;
    }

    .fact strong {
      margin-right: 4px;
    }

    @media (max-width: 580px) {
      .pq-layout {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>
<body class="no-tooltips">
  <div id="demoContainer">
    <h2>Priority Queue Demo <small>(min-priority)</small></h2>

    <div class="pq-controls">
      <label>Value <input id="valueInput" type="text" maxlength="5" value="E"></label>
      <label>Priority <input id="priorityInput" type="number" min="-99" max="99" value="3"></label>
      <button id="insertBtn">Insert</button>
      <button id="peekBtn">Peek</button>
      <button id="extractBtn">Extract</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="pq-layout">
      <div class="pq-stage">
        <svg id="pqSvg" viewBox="0 0 600 600" role="img"
             aria-labelledby="pqTitle pqDescription">
          <title id="pqTitle">Logical contents of a priority queue</title>
          <desc id="pqDescription">
            Entries are scattered to avoid suggesting any particular internal
            representation. The entry with the smallest priority number is next.
          </desc>
        </svg>
      </div>

      <div class="pq-notes">
        <div id="resultBox" class="result-box">
          <div class="result-label">Operation result</div>
          <span id="returnValue" class="return-value none">none</span>
          <div id="resultNote">No operation has returned an entry yet.</div>
        </div>
        <div class="fact"><strong>Next entry:</strong><span id="nextValue"></span></div>
        <div class="fact"><strong>Size:</strong><span id="queueSize"></span></div>
      </div>
    </div>
  </div>

  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const positions = [
      { x: 90, y: 110 },
      { x: 300, y: 125 },
      { x: 510, y: 100 },
      { x: 120, y: 300 },
      { x: 320, y: 295 },
      { x: 505, y: 320 },
      { x: 95, y: 500 },
      { x: 300, y: 505 },
      { x: 515, y: 490 }
    ];

    let entries = [];
    let nextSequence = 0;
    let highlightedId = null;
    let insertedId = null;
    let resultMode = 'none';
    let returnedText = 'none';
    let resultNote = 'No operation has returned an entry yet.';

    function makeEntry(value, priority, slot) {
      return {
        id: nextSequence,
        sequence: nextSequence++,
        value,
        priority,
        slot
      };
    }

    function resetState() {
      nextSequence = 0;
      entries = [
        makeEntry('A', 4, 0),
        makeEntry('B', 2, 2),
        makeEntry('C', 5, 7),
        makeEntry('D', 1, 3)
      ];
      highlightedId = null;
      insertedId = null;
      resultMode = 'none';
      returnedText = 'none';
      resultNote = 'No operation has returned an entry yet.';
      render('Initial priority queue. D:1 is next because 1 is the smallest priority key.');
    }

    function bestEntry() {
      if (entries.length === 0) {
        return null;
      }

      return entries.reduce((best, entry) => {
        if (entry.priority < best.priority) {
          return entry;
        }
        if (entry.priority === best.priority && entry.sequence < best.sequence) {
          return entry;
        }
        return best;
      });
    }

    function formatEntry(entry) {
      return `${entry.value}:${entry.priority}`;
    }

    function availableSlot() {
      const used = new Set(entries.map(entry => entry.slot));
      return positions.findIndex((position, index) => !used.has(index));
    }

    function createSvgElement(name, attributes = {}) {
      const element = document.createElementNS(SVG_NS, name);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }

    function render(message) {
      document.getElementById('status').textContent = message;
      document.getElementById('queueSize').textContent = entries.length;

      const best = bestEntry();
      document.getElementById('nextValue').textContent =
        best === null ? 'none (queue is empty)' : formatEntry(best);

      const resultBox = document.getElementById('resultBox');
      resultBox.className =
        resultMode === 'error'
          ? 'result-box has-error'
          : resultMode === 'value'
            ? 'result-box has-return'
            : 'result-box';

      const returnValue = document.getElementById('returnValue');
      returnValue.className = 'return-value';
      if (resultMode === 'none') {
        returnValue.classList.add('none');
      } else if (resultMode === 'error') {
        returnValue.classList.add('error');
      }
      returnValue.textContent = returnedText;
      document.getElementById('resultNote').textContent = resultNote;

      const svg = document.getElementById('pqSvg');
      svg.replaceChildren();

      const title = createSvgElement('title', { id: 'pqTitle' });
      title.textContent = 'Logical contents of a priority queue';
      svg.appendChild(title);

      const description = createSvgElement('desc', { id: 'pqDescription' });
      description.textContent =
        'Entries are scattered to avoid suggesting any particular internal representation. ' +
        (best === null
          ? 'The priority queue is empty.'
          : `${formatEntry(best)} has the smallest priority number and is next.`);
      svg.appendChild(description);

      const label = createSvgElement('text', { x: 20, y: 28, class: 'stage-label' });
      label.textContent = 'Logical collection — positions have no meaning';
      svg.appendChild(label);

      if (entries.length === 0) {
        const empty = createSvgElement('text', {
          x: 300,
          y: 310,
          class: 'empty-message'
        });
        empty.textContent = 'empty priority queue';
        svg.appendChild(empty);
        return;
      }

      entries.forEach(entry => {
        const position = positions[entry.slot];
        const classes = ['entry'];
        if (best && entry.id === best.id) {
          classes.push('next');
        }
        if (entry.id === insertedId) {
          classes.push('inserted');
        }
        if (entry.id === highlightedId) {
          classes.push('peeked');
        }

        const group = createSvgElement('g', {
          class: classes.join(' '),
          role: 'img',
          'aria-label': `${entry.value}, priority ${entry.priority}` +
            (best && entry.id === best.id ? ', next entry' : '')
        });
        group.appendChild(createSvgElement('circle', {
          cx: position.x,
          cy: position.y,
          r: 44
        }));

        const text = createSvgElement('text', {
          x: position.x,
          y: position.y + 1
        });
        text.textContent = formatEntry(entry);
        group.appendChild(text);

        if (best && entry.id === best.id) {
          const nextLabel = createSvgElement('text', {
            x: position.x,
            y: position.y - 56,
            class: 'next-label'
          });
          nextLabel.textContent = 'NEXT';
          group.appendChild(nextLabel);
        }
        svg.appendChild(group);
      });
    }

    function showUnderflow(operation) {
      highlightedId = null;
      insertedId = null;
      resultMode = 'error';
      returnedText = 'underflow';
      resultNote = `There is no entry to ${operation}.`;
      render(`${operation[0].toUpperCase() + operation.slice(1)} cannot succeed because the priority queue is empty.`);
    }

    document.getElementById('insertBtn').addEventListener('click', () => {
      const value = document.getElementById('valueInput').value.trim();
      const priorityText = document.getElementById('priorityInput').value.trim();
      const priority = Number(priorityText);

      if (value === '') {
        render('Enter a value before inserting an entry.');
        return;
      }
      if (priorityText === '' || !Number.isInteger(priority) || priority < -99 || priority > 99) {
        render('Enter a whole-number priority from -99 through 99.');
        return;
      }

      const slot = availableSlot();
      if (slot === -1) {
        resultMode = 'error';
        returnedText = 'demo full';
        resultNote = 'Extract an entry before inserting another.';
        render('This drawing is full. The abstract priority queue itself need not have this limit.');
        return;
      }

      const entry = makeEntry(value, priority, slot);
      entries.push(entry);
      highlightedId = null;
      insertedId = entry.id;
      resultMode = 'none';
      returnedText = 'none';
      resultNote = 'Insert changes the queue but does not return an entry.';

      const best = bestEntry();
      const nextMessage =
        best.id === entry.id
          ? ` It is now next because ${priority} is the smallest key.`
          : ` ${formatEntry(best)} remains next.`;
      render(`Inserted ${formatEntry(entry)}. Its drawn position has no ordering meaning.${nextMessage}`);
    });

    document.getElementById('peekBtn').addEventListener('click', () => {
      const best = bestEntry();
      if (best === null) {
        showUnderflow('peek');
        return;
      }

      highlightedId = best.id;
      insertedId = null;
      resultMode = 'value';
      returnedText = formatEntry(best);
      resultNote = 'Peek returns the next entry without removing it.';
      render(`Peek returns ${formatEntry(best)}. The queue still contains ${entries.length} entries.`);
    });

    document.getElementById('extractBtn').addEventListener('click', () => {
      const best = bestEntry();
      if (best === null) {
        showUnderflow('extract');
        return;
      }

      entries = entries.filter(entry => entry.id !== best.id);
      highlightedId = null;
      insertedId = null;
      resultMode = 'value';
      returnedText = formatEntry(best);
      resultNote = 'Extract returns the highest-priority entry and removes it.';

      const next = bestEntry();
      render(
        `Extract removed ${formatEntry(best)}. ` +
        (next === null
          ? 'The priority queue is now empty.'
          : `${formatEntry(next)} is now next.`)
      );
    });

    ['valueInput', 'priorityInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          document.getElementById('insertBtn').click();
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', resetState);

    resetState();
  </script>
</body>
</html>
