<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Separate Chaining Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    #demoContainer { max-width: 1080px; margin: 0 auto; }
    #demoContainer h2 { padding-right: 120px; }
    .chaining-controls { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; margin-bottom: 8px; }
    .chaining-control-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chaining-control-row label { display: inline-flex; align-items: center; gap: 4px; }
    .chaining-navigation-group { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
    .chaining-control-row input[type="number"] { width: 56px; }
    #keyInput { width: 58px; }
    .chaining-control-row button:disabled { cursor: not-allowed; opacity: 0.55; }
    #demoContainer .legend-box.chaining-bucket-swatch { background: #f7fbff; border-color: #315d7d; }
    #demoContainer .legend-box.chaining-key-swatch { background: #cce3ff; border-color: #274c77; }
    #demoContainer .legend-box.chaining-current-swatch { background: #fff3a6; border-color: #b97820; border-width: 3px; }
    #demoContainer .legend-box.chaining-result-swatch { background: #d9f5d6; border-color: #2e7d32; border-width: 3px; }
    #chainingStatus { min-height: 42px; margin: 8px 0; padding: 7px 10px; border-left: 4px solid #4a768b; background: #f7fbfd; line-height: 1.45; }
    .chaining-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; color: #334e68; margin: 5px 0 8px; }
    .chaining-table-wrap { width: 100%; overflow-x: auto; }
    #hashTable { min-width: 540px; padding: 10px; border: 1px solid #9fb3c8; border-radius: 5px; background: #fbfdff; }
    .chaining-row { display: flex; align-items: center; min-height: 48px; }
    .chaining-bucket { display: grid; grid-template-columns: 32px 58px; width: 90px; height: 48px; align-items: center; flex: 0 0 90px; border: 2px solid #315d7d; background: #f7fbff; color: #17324d; box-sizing: border-box; }
    .chaining-index { display: flex; height: 100%; align-items: center; justify-content: center; border-right: 1px solid #9fb3c8; font-weight: 700; }
    .chaining-bucket-label { text-align: center; color: #486581; font-size: 12px; }
    .chaining-chain { display: flex; align-items: center; min-width: 0; }
    .chaining-arrow { width: 38px; flex: 0 0 38px; color: #58758f; font-size: 22px; line-height: 1; text-align: center; }
    .chaining-node { display: flex; width: 72px; height: 38px; align-items: center; justify-content: center; flex: 0 0 72px; border: 2px solid #274c77; border-radius: 9px; background: #cce3ff; color: #102a43; font-weight: 700; box-sizing: border-box; }
    .chaining-row.current .chaining-bucket, .chaining-node.current { background: #fff3a6; border-color: #b97820; border-width: 3px; }
    .chaining-node.found-inserted { background: #d9f5d6; border-color: #2e7d32; border-width: 3px; }
    .chaining-null { margin-left: 12px; color: #6b7c8f; font-size: 13px; font-style: italic; }
    @media (max-width: 650px) {
      #demoContainer h2 { padding-right: 0; }
      .chaining-control-row { align-items: stretch; }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DQ5LVZVFDC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DQ5LVZVFDC');
  </script>
</head>
<body class="no-tooltips">
  <main id="demoContainer">
    <h2>Separate Chaining Operations</h2>
    <div class="chaining-controls">
      <div class="chaining-control-row">
        <label>Table size <input type="number" id="bucketCount" min="2" max="12" value="8"></label>
        <label>Initial keys <input type="number" id="initCount" min="0" max="30" value="6"></label>
        <button id="generateBtn">Random Table</button>
      </div>
      <div class="chaining-control-row" aria-label="Hash table operations">
        <label>Key <input type="number" id="keyInput"></label>
        <button id="searchBtn">Search</button>
        <button id="insertBtn">Insert</button>
        <button id="removeBtn">Remove</button>
        <span class="chaining-navigation-group" aria-label="Step navigation">
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </span>
      </div>
    </div>

    <div class="legend" aria-label="Separate chaining legend">
      <div class="legend-label"><strong>Legend:</strong></div>
      <div class="legend-items">
        <span class="legend-box chaining-bucket-swatch"></span> bucket array
        <span class="legend-box chaining-key-swatch"></span> key
        <span class="legend-box chaining-current-swatch"></span> current
        <span class="legend-box chaining-result-swatch"></span> found/inserted
      </div>
    </div>

    <div id="chainingStatus" role="status" aria-live="polite">A random table is ready. Choose an operation to begin.</div>
    <div class="chaining-meta">
      <span id="stepCount"></span>
      <span id="tableStats"></span>
    </div>
    <div class="chaining-table-wrap">
      <div id="hashTable" role="img" aria-label="Separate chaining hash table"></div>
    </div>
  </main>

  <script>
    const bucketCountInput = document.getElementById('bucketCount');
    const initCountInput = document.getElementById('initCount');
    const keyInput = document.getElementById('keyInput');
    const statusElement = document.getElementById('chainingStatus');
    const stepCountElement = document.getElementById('stepCount');
    const tableStatsElement = document.getElementById('tableStats');
    const tableElement = document.getElementById('hashTable');
    const prevButton = document.getElementById('prevBtn');
    const nextButton = document.getElementById('nextBtn');
    const stateControls = [
      bucketCountInput,
      initCountInput,
      keyInput,
      document.getElementById('generateBtn'),
      document.getElementById('searchBtn'),
      document.getElementById('insertBtn'),
      document.getElementById('removeBtn')
    ];

    let table = [];
    let steps = [];
    let stepIndex = 0;

    function mod(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function copyTable(source) {
      return source.map(chain => [...chain]);
    }

    function recordStep(description, highlight = {}) {
      steps.push({ table: copyTable(table), description, highlight });
    }

    function beginOperation(description) {
      steps = [];
      stepIndex = 0;
      recordStep(description);
    }

    function render() {
      const step = steps[stepIndex];
      if (!step) return;

      statusElement.textContent = step.description;
      stepCountElement.textContent = `Step ${stepIndex + 1} of ${steps.length}`;
      const keyCount = step.table.reduce((total, chain) => total + chain.length, 0);
      const loadFactor = step.table.length ? (keyCount / step.table.length).toFixed(2) : '0.00';
      tableStatsElement.textContent = `${keyCount} key${keyCount === 1 ? '' : 's'} · load factor ${loadFactor}`;
      prevButton.disabled = stepIndex === 0;
      nextButton.disabled = stepIndex === steps.length - 1;
      const operationInProgress = stepIndex < steps.length - 1;
      stateControls.forEach(control => {
        control.disabled = operationInProgress;
      });

      tableElement.replaceChildren();
      step.table.forEach((chain, bucketIndex) => {
        const row = document.createElement('div');
        row.className = 'chaining-row';
        if (step.highlight.bucketIndex === bucketIndex) row.classList.add('current');

        const bucket = document.createElement('div');
        bucket.className = 'chaining-bucket';
        bucket.innerHTML = `<span class="chaining-index">${bucketIndex}</span><span class="chaining-bucket-label">${chain.length ? 'bucket' : 'empty'}</span>`;
        row.appendChild(bucket);

        const chainElement = document.createElement('div');
        chainElement.className = 'chaining-chain';
        if (chain.length) {
          chain.forEach((key, listIndex) => {
            const arrow = document.createElement('span');
            arrow.className = 'chaining-arrow';
            arrow.setAttribute('aria-hidden', 'true');
            arrow.textContent = '→';
            chainElement.appendChild(arrow);

            const node = document.createElement('span');
            node.className = 'chaining-node';
            node.textContent = key;
            if (step.highlight.bucketIndex === bucketIndex && step.highlight.listIndex === listIndex) {
              node.classList.add(step.highlight.state || 'current');
            }
            chainElement.appendChild(node);
          });
          const nullLabel = document.createElement('span');
          nullLabel.className = 'chaining-null';
          nullLabel.textContent = 'null';
          chainElement.appendChild(nullLabel);
        }
        row.appendChild(chainElement);
        tableElement.appendChild(row);
      });
    }

    function generateRandomTable() {
      const size = Math.min(12, Math.max(2, Number.parseInt(bucketCountInput.value, 10) || 8));
      const count = Math.min(30, Math.max(0, Number.parseInt(initCountInput.value, 10) || 0));
      bucketCountInput.value = size;
      initCountInput.value = count;
      table = Array.from({ length: size }, () => []);
      const keys = Array.from({ length: count }, () => Math.floor(Math.random() * 100));
      keys.forEach(key => table[mod(key, size)].push(key));
      steps = [];
      stepIndex = 0;
      recordStep(`Generated ${count} random key${count === 1 ? '' : 's'} in ${size} buckets.`);
      render();
    }

    function readKey(operation) {
      if (!keyInput.value.trim()) {
        statusElement.textContent = `Enter an integer key to ${operation}.`;
        return null;
      }
      const key = Number(keyInput.value);
      if (!Number.isInteger(key)) {
        statusElement.textContent = `Enter an integer key to ${operation}.`;
        return null;
      }
      return key;
    }

    function searchForKey() {
      const key = readKey('search for');
      if (key === null) return;

      const bucketIndex = mod(key, table.length);
      beginOperation(`Search for ${key}: compute ${key} mod ${table.length} = ${bucketIndex}.`);
      const chain = table[bucketIndex];
      if (!chain.length) {
        recordStep(`Bucket ${bucketIndex} is empty, so ${key} is not in the table.`, { bucketIndex });
      } else {
        recordStep(`Bucket ${bucketIndex} contains ${chain.length} key${chain.length === 1 ? '' : 's'}; scan its chain from left to right.`, { bucketIndex });
      }
      let found = false;
      for (let listIndex = 0; listIndex < chain.length; listIndex++) {
        if (chain[listIndex] === key) {
          recordStep(`Bucket ${bucketIndex}, node ${listIndex + 1}: stored key ${chain[listIndex]} matches ${key}. The search succeeds.`, { bucketIndex, listIndex, state: 'found-inserted' });
          found = true;
          break;
        }
        recordStep(`Bucket ${bucketIndex}, node ${listIndex + 1}: stored key ${chain[listIndex]} does not match ${key}; continue to the next node.`, { bucketIndex, listIndex, state: 'current' });
      }
      if (!found && chain.length) {
        recordStep(`Reached null after checking all ${chain.length} nodes in bucket ${bucketIndex}; ${key} is not in the table.`, { bucketIndex });
      }
      stepIndex = 0;
      render();
    }

    function insertKey() {
      const key = readKey('insert');
      if (key === null) return;

      const bucketIndex = mod(key, table.length);
      beginOperation(`Insert ${key}: compute ${key} mod ${table.length} = ${bucketIndex}.`);
      const chain = table[bucketIndex];
      recordStep(
        chain.length
          ? `Before inserting, scan all ${chain.length} nodes in bucket ${bucketIndex} to make sure ${key} is not already present.`
          : `Bucket ${bucketIndex} is empty, so ${key} is not already present.`,
        { bucketIndex }
      );
      for (let listIndex = 0; listIndex < chain.length; listIndex++) {
        if (chain[listIndex] === key) {
          recordStep(`Bucket ${bucketIndex}, node ${listIndex + 1}: stored key ${chain[listIndex]} matches ${key}. It is already present, so do not insert a duplicate.`, {
            bucketIndex,
            listIndex,
            state: 'found-inserted'
          });
          stepIndex = 0;
          render();
          return;
        }
        recordStep(`Bucket ${bucketIndex}, node ${listIndex + 1}: stored key ${chain[listIndex]} does not match ${key}; continue checking for a duplicate.`, { bucketIndex, listIndex, state: 'current' });
      }
      table[bucketIndex].push(key);
      recordStep(`No duplicate was found, so append ${key} to bucket ${bucketIndex}'s chain.`, {
        bucketIndex,
        listIndex: table[bucketIndex].length - 1,
        state: 'found-inserted'
      });
      stepIndex = 0;
      render();
    }

    function removeKey() {
      const key = readKey('remove');
      if (key === null) return;

      const bucketIndex = mod(key, table.length);
      beginOperation(`Remove ${key}: compute ${key} mod ${table.length} = ${bucketIndex}.`);
      const chain = table[bucketIndex];
      const listIndex = chain.indexOf(key);
      recordStep(
        chain.length
          ? `Bucket ${bucketIndex} contains ${chain.length} key${chain.length === 1 ? '' : 's'}; scan its chain to find ${key}.`
          : `Bucket ${bucketIndex} is empty, so there is nothing to remove.`,
        { bucketIndex }
      );

      if (listIndex === -1) {
        for (let index = 0; index < chain.length; index++) {
          recordStep(`Bucket ${bucketIndex}, node ${index + 1}: stored key ${chain[index]} does not match ${key}; continue to the next node.`, { bucketIndex, listIndex: index, state: 'current' });
        }
        if (chain.length) {
          recordStep(`Reached null after checking all ${chain.length} nodes in bucket ${bucketIndex}; ${key} is not present, so nothing is removed.`, { bucketIndex });
        }
      } else {
        for (let index = 0; index < listIndex; index++) {
          recordStep(`Bucket ${bucketIndex}, node ${index + 1}: stored key ${chain[index]} does not match ${key}; continue to the next node.`, { bucketIndex, listIndex: index, state: 'current' });
        }
        recordStep(`Bucket ${bucketIndex}, node ${listIndex + 1}: stored key ${chain[listIndex]} matches ${key}. Unlink this node.`, {
          bucketIndex,
          listIndex,
          state: 'found-inserted'
        });
        table[bucketIndex].splice(listIndex, 1);
        recordStep(`Removed ${key} from bucket ${bucketIndex}.`, { bucketIndex });
      }
      stepIndex = 0;
      render();
    }

    document.getElementById('generateBtn').addEventListener('click', generateRandomTable);
    document.getElementById('searchBtn').addEventListener('click', searchForKey);
    document.getElementById('insertBtn').addEventListener('click', insertKey);
    document.getElementById('removeBtn').addEventListener('click', removeKey);
    keyInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') searchForKey();
    });
    prevButton.addEventListener('click', () => {
      if (stepIndex > 0) stepIndex--;
      render();
    });
    nextButton.addEventListener('click', () => {
      if (stepIndex < steps.length - 1) stepIndex++;
      render();
    });

    generateRandomTable();
  </script>
</body>
</html>
