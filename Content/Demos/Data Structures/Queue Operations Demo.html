<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/DAIADS/scripts/content-page-routing.js"></script>
  <meta charset="UTF-8">
  <title>Queue Operations Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    #demoContainer h2 {
      padding-right: 120px;
    }
    .queue-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .queue-controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .queue-controls input {
      width: 90px;
    }
    #status {
      min-height: 42px;
      margin: 8px 0;
      padding: 6px 8px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
    }
    .queue-layout {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(260px, 340px);
      gap: 18px;
      align-items: start;
      margin-top: 12px;
    }
    .queue-visual {
      max-width: 760px;
      overflow-x: auto;
      padding: 12px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .queue-line {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 8px;
      min-height: 72px;
    }
    .queue-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .queue-item {
      min-width: 54px;
      min-height: 44px;
      max-width: 140px;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #cce3ff;
      box-sizing: border-box;
      font-weight: bold;
      padding: 0 10px;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .queue-item.changed {
      background: #8ecae6;
    }
    .queue-item.returned {
      background: #74b474;
      border-width: 2px;
    }
    .queue-role {
      color: #333;
      font-size: 12px;
      font-weight: bold;
      min-height: 16px;
    }
    .queue-notes {
      line-height: 1.5;
      max-width: 340px;
    }
    .result-box,
    .empty-state {
      color: #555;
      background: #f6f6f6;
      padding: 10px 12px;
    }
    .result-box {
      display: grid;
      gap: 8px;
      border: 1px solid #777;
      border-left: 4px solid #4a768b;
      margin-bottom: 10px;
    }
    .result-box.has-return {
      border-left-color: #2e7d32;
      background: #f4fbf4;
    }
    .result-box.has-error {
      border-left-color: #b3261e;
      background: #fff5f5;
    }
    .result-box.no-return {
      border-left-color: #777;
    }
    .result-label {
      color: #555;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .return-display {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .return-word {
      font-weight: bold;
    }
    .return-value {
      display: inline-flex;
      min-width: 54px;
      min-height: 42px;
      max-width: 180px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #333;
      background: #74b474;
      color: #111;
      font-weight: bold;
      box-sizing: border-box;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .return-value.empty {
      border-style: dashed;
      background: #fff;
      color: #555;
      font-weight: normal;
    }
    .return-value.error {
      background: #ffa088;
      color: #111;
    }
    .queue-facts {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .fact {
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .fact strong {
      margin-right: 4px;
    }
    .empty-state {
      border: 1px dashed #777;
      font-style: italic;
      text-align: center;
    }
    @media (max-width: 720px) {
      .queue-layout {
        grid-template-columns: 1fr;
      }
      .queue-notes {
        max-width: none;
      }
    }
  </style>
</head>
<body class="no-tooltips">
  <div id="demoContainer">
    <h2>Queue Operations Demo</h2>

    <div class="queue-controls">
      <label>Value <input id="valueInput" type="text" value="X"></label>
      <button id="enqueueBtn">Enqueue</button>
      <button id="dequeueBtn">Dequeue</button>
      <button id="peekBtn">Front</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status"></div>
    <div class="queue-layout">
      <div class="queue-visual">
        <div id="queueLine" class="queue-line"></div>
      </div>
      <div class="queue-notes">
        <div id="resultBox" class="result-box"></div>
        <div class="queue-facts">
          <div class="fact"><strong>Front:</strong><span id="frontValue"></span></div>
          <div class="fact"><strong>Back:</strong><span id="backValue"></span></div>
          <div class="fact"><strong>Size:</strong><span id="queueSize"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let items;
    let returnedValue = null;
    let resultMode = 'none';
    let returnText = '';
    let highlightedReturnIndex = -1;
    let changedIndex = -1;

    function resetState() {
      items = ['A', 'B', 'C'];
      returnedValue = null;
      resultMode = 'none';
      returnText = 'No operation has returned a value yet.';
      highlightedReturnIndex = -1;
      changedIndex = -1;
      render('Initial queue. A has waited the longest, so it is at the front.');
    }

    function readValue() {
      return document.getElementById('valueInput').value.trim();
    }

    function frontItem() {
      return items.length === 0 ? '' : items[0];
    }

    function backItem() {
      return items.length === 0 ? '' : items[items.length - 1];
    }

    function render(message) {
      document.getElementById('status').textContent = message;
      document.getElementById('frontValue').textContent = items.length === 0 ? 'none' : frontItem();
      document.getElementById('backValue').textContent = items.length === 0 ? 'none' : backItem();
      document.getElementById('queueSize').textContent = items.length;

      const resultBox = document.getElementById('resultBox');
      resultBox.className =
        resultMode === 'error'
          ? 'result-box has-error'
          : returnedValue === null
            ? 'result-box no-return'
            : 'result-box has-return';
      resultBox.innerHTML = '';

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = 'Result';
      resultBox.appendChild(label);

      const display = document.createElement('div');
      display.className = 'return-display';

      const word = document.createElement('span');
      word.className = 'return-word';
      word.textContent = resultMode === 'error' ? 'throws' : 'returns';
      display.appendChild(word);

      const value = document.createElement('span');
      value.className = 'return-value';
      if (returnedValue === null) {
        value.classList.add('empty');
        value.textContent = 'none';
      } else {
        if (resultMode === 'error') {
          value.classList.add('error');
        }
        value.textContent = returnedValue;
      }
      display.appendChild(value);
      resultBox.appendChild(display);

      const note = document.createElement('div');
      note.textContent = returnText;
      resultBox.appendChild(note);

      const queueLine = document.getElementById('queueLine');
      queueLine.innerHTML = '';

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'empty queue';
        queueLine.appendChild(empty);
        return;
      }

      items.forEach((value, index) => {
        const entry = document.createElement('div');
        entry.className = 'queue-entry';

        const role = document.createElement('div');
        role.className = 'queue-role';
        if (items.length === 1) {
          role.textContent = 'front/back';
        } else if (index === 0) {
          role.textContent = 'front';
        } else if (index === items.length - 1) {
          role.textContent = 'back';
        } else {
          role.textContent = '';
        }

        const item = document.createElement('div');
        item.className = 'queue-item';
        if (index === 0) {
          item.classList.add('front');
        }
        if (index === items.length - 1) {
          item.classList.add('back');
        }
        if (index === changedIndex) {
          item.classList.add('changed');
        }
        if (index === highlightedReturnIndex) {
          item.classList.add('returned');
        }
        item.textContent = value;

        entry.appendChild(role);
        entry.appendChild(item);
        queueLine.appendChild(entry);
      });
    }

    document.getElementById('enqueueBtn').addEventListener('click', () => {
      const value = readValue();
      if (value === '') {
        returnedValue = null;
        resultMode = 'none';
        returnText = 'Enqueue needs a value to add.';
        highlightedReturnIndex = -1;
        changedIndex = -1;
        render('Enter a value before enqueueing.');
        return;
      }
      items.push(value);
      returnedValue = null;
      resultMode = 'none';
      returnText = 'Enqueue changes the queue; it does not remove or reveal a value.';
      highlightedReturnIndex = -1;
      changedIndex = items.length - 1;
      render(`Enqueue adds ${value} at the back of the queue.`);
    });

    document.getElementById('dequeueBtn').addEventListener('click', () => {
      if (items.length === 0) {
        returnedValue = 'QueueUnderflowError';
        resultMode = 'error';
        returnText = 'There is no front element to dequeue.';
        highlightedReturnIndex = -1;
        changedIndex = -1;
        render('Queue underflow: dequeue throws an error because the queue is empty.');
        return;
      }
      returnedValue = items.shift();
      resultMode = 'value';
      returnText = `${returnedValue} was removed from the front of the queue.`;
      highlightedReturnIndex = -1;
      changedIndex = items.length === 0 ? -1 : 0;
      render(`Dequeue returns ${returnedValue} and removes it from the front.`);
    });

    document.getElementById('peekBtn').addEventListener('click', () => {
      if (items.length === 0) {
        returnedValue = 'QueueUnderflowError';
        resultMode = 'error';
        returnText = 'There is no front element to return.';
        highlightedReturnIndex = -1;
        changedIndex = -1;
        render('Queue underflow: front throws an error because the queue is empty.');
        return;
      }
      returnedValue = frontItem();
      resultMode = 'value';
      returnText = `${returnedValue} stays in the queue after front.`;
      highlightedReturnIndex = 0;
      changedIndex = -1;
      render(`Front returns ${frontItem()} without removing it.`);
    });

    document.getElementById('valueInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        document.getElementById('enqueueBtn').click();
      }
    });

    document.getElementById('resetBtn').addEventListener('click', resetState);

    resetState();
  </script>
</body>
</html>
