<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/DAIADS/scripts/content-page-routing.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Binary Tree Algorithms Demo</title>
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <style>
    .edge {
      stroke: #64748b;
      stroke-width: 2;
    }

    .tree-node circle {
      fill: #f0f8ff;
      stroke: #003366;
      stroke-width: 2;
      transition: fill 160ms ease, stroke 160ms ease, opacity 160ms ease;
    }

    .tree-node text.node-label {
      fill: #111827;
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .tree-node.outside-subtree,
    .edge.outside-subtree {
      opacity: 0.22;
    }

    .tree-node.in-stack circle {
      fill: #fff3cd;
      stroke: #8a6d00;
    }

    .tree-node.completed circle {
      fill: #d9ead3;
      stroke: #2f6b2f;
    }

    .tree-node.current circle {
      fill: #ffd59a;
      stroke: #b45309;
      stroke-width: 4;
    }

    .start-ring {
      fill: none;
      stroke: #5b21b6;
      stroke-width: 2;
      stroke-dasharray: 5 4;
    }

    .return-label {
      fill: #205b20;
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .null-marker ellipse {
      fill: #ffffff;
      stroke: #b45309;
      stroke-width: 2;
      stroke-dasharray: 4 3;
    }

    .null-marker text {
      fill: #92400e;
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 7px;
      font-size: 0.76rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border: 2px solid #003366;
      border-radius: 50%;
      background: #f0f8ff;
    }

    .swatch.current {
      border-color: #b45309;
      background: #ffd59a;
    }

    .swatch.stack {
      border-color: #8a6d00;
      background: #fff3cd;
    }

    .swatch.done {
      border-color: #2f6b2f;
      background: #d9ead3;
    }

    .swatch.start {
      border-color: #5b21b6;
      border-style: dashed;
      background: #ffffff;
    }

    .swatch.null {
      width: 20px;
      border-color: #b45309;
      border-style: dashed;
      border-radius: 8px;
      background: #ffffff;
    }

    #stepCounter {
      margin-bottom: 9px;
      color: #52677a;
      font-size: 0.8rem;
      font-weight: bold;
    }

    #computation {
      min-height: 96px;
      padding: 10px;
      border: 1px solid #d3dbe3;
      border-radius: 4px;
      background: #f8fafc;
      line-height: 1.55;
    }

    #computation code {
      font-family: Consolas, Menlo, monospace;
      font-size: 0.93rem;
      white-space: pre-wrap;
    }

    #resultBox {
      margin-top: 10px;
      padding: 9px;
      border: 1px solid #c5d7c0;
      border-radius: 4px;
      background: #eef8eb;
      line-height: 1.45;
    }

    #resultBox strong {
      color: #245624;
    }

    #callStack {
      min-height: 235px;
      max-height: 350px;
      overflow: auto;
      padding: 8px;
      border: 1px solid #d3dbe3;
      border-radius: 4px;
      background: #f8fafc;
      font-family: Consolas, Menlo, monospace;
      font-size: 0.86rem;
    }

    .stack-empty {
      color: #64748b;
      font-style: italic;
    }

    .stack-frame {
      margin: 3px 0;
      padding: 6px 8px;
      border-left: 4px solid #94a3b8;
      border-radius: 2px;
      background: #ffffff;
    }

    .stack-frame.current {
      border-left-color: #d97706;
      background: #fff7df;
    }

    .stack-frame.returned {
      border-left-color: #3f7d3f;
      background: #eef8eb;
    }

    .frame-locals {
      margin-top: 3px;
      color: #52677a;
      font-size: 0.78rem;
      white-space: normal;
    }

    #pseudocode {
      min-height: 235px;
      overflow-x: auto;
      padding: 8px 0;
      border: 1px solid #d3dbe3;
      border-radius: 4px;
      background: #f8fafc;
      font-family: Consolas, Menlo, monospace;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .code-line {
      display: flex;
      min-height: 1.55em;
      padding: 0 8px;
    }

    .line-content {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .line-number {
      flex: 0 0 28px;
      margin-right: 9px;
      color: #94a3b8;
      text-align: right;
      user-select: none;
    }

    .code-line.highlight {
      background: #ffff99;
    }

    .code-token.highlight {
      padding: 1px 2px;
      border-radius: 2px;
      background: #ffd966;
    }

    #demoContainer {
      max-width: 980px;
      margin: 0 auto;
    }

    #commentary {
      min-height: 42px;
      margin: 8px 0;
      padding: 8px 10px;
      border-left: 4px solid #4a768b;
      background: #f7fbfd;
      line-height: 1.35;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(350px, 1.1fr) minmax(275px, 0.9fr);
      gap: 12px;
    }

    .visual-column,
    .trace-column {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .panel-grid,
    .lower-grid {
      display: contents;
    }

    .panel {
      min-width: 0;
      margin: 0;
      padding: 9px;
      border: 1px solid #b8c6cc;
      background: #fff;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    #treeSvg {
      display: block;
      width: 100%;
      height: 350px;
      border: 1px solid #ccc;
      background: #fff;
    }

    #pseudocode {
      min-height: 184px;
      max-height: 224px;
      border-color: #ccc;
      border-radius: 0;
      background: #f8fafb;
    }

    #computation {
      min-height: 72px;
      border-radius: 0;
    }

    @media (max-width: 680px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }

      .panel-grid,
      .lower-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      #treeSvg {
        height: 330px;
      }
    }

  </style>
</head>
<body class="no-tooltips">
  <main id="demoContainer">
    <h2>Basic Binary Tree Algorithms Demo</h2>

    <div id="controls" aria-label="Demo settings">
      <label for="algorithmSelect">Algorithm:</label>
      <select id="algorithmSelect">
        <option value="size">Count nodes (size)</option>
        <option value="height">Compute height</option>
        <option value="leaves">Count leaves</option>
        <option value="twoChildren">Count nodes with two children</option>
      </select>

      <label for="treeSelect">Tree:</label>
      <select id="treeSelect">
        <option value="complete">Complete tree</option>
        <option value="degenerate">Degenerate tree</option>
        <option value="irregular">Irregular tree</option>
        <option value="larger">Larger tree</option>
      </select>

      <label for="startSelect">Starting node:</label>
      <select id="startSelect"></select>
    </div>

    <div id="buttons" style="margin: 10px 0;" aria-label="Step controls">
      <button id="previousButton" type="button">Previous</button>
      <button id="nextButton" type="button">Next</button>
      <button id="playButton" type="button">Play</button>
      <button id="restartButton" type="button">Restart</button>
      <label for="speedSelect">Speed:</label>
      <select id="speedSelect">
        <option value="1500">Slow</option>
        <option value="900" selected>Medium</option>
        <option value="450">Fast</option>
      </select>
    </div>

    <div class="workspace-grid">
      <div class="visual-column">
        <div class="panel-grid">
          <section class="panel" aria-labelledby="treeHeading">
        <h3 id="treeHeading">Tree</h3>
        <svg id="treeSvg" role="img" aria-labelledby="treeTitle treeDescription">
          <title id="treeTitle">Binary tree used by the recursive algorithm</title>
          <desc id="treeDescription">The current recursive call and returned values are highlighted.</desc>
        </svg>
        <div id="legend" aria-label="Tree colors">
          <span class="legend-item"><span class="swatch current"></span>current call</span>
          <span class="legend-item"><span class="swatch stack"></span>waiting call</span>
          <span class="legend-item"><span class="swatch done"></span>returned value</span>
          <span class="legend-item"><span class="swatch start"></span>starting node</span>
          <span class="legend-item"><span class="swatch null"></span>null argument</span>
        </div>
          </section>

          <section class="panel" aria-labelledby="pseudocodeHeading">
        <h3 id="pseudocodeHeading">Pseudocode</h3>
        <div id="pseudocode" aria-label="Pseudocode with current line highlighted"></div>
          </section>
        </div>
      </div>

      <div class="trace-column">
        <div id="commentary" role="status" aria-live="polite"></div>

        <div class="lower-grid">
          <section class="panel" aria-labelledby="stackHeading">
        <h3 id="stackHeading">Call Stack</h3>
        <div id="callStack"></div>
          </section>

          <section class="panel" aria-labelledby="computationHeading">
        <h3 id="computationHeading">Current Computation</h3>
        <div id="stepCounter"></div>
        <div id="computation"></div>
        <div id="resultBox"></div>
          </section>
        </div>

      </div>
    </div>
  </main>

  <script>
    "use strict";

    const TREES = {
      complete: {
        name: "Complete tree",
        root: "A",
        viewBox: "0 0 520 340",
        nodes: {
          A: { left: "B", right: "C", x: 260, y: 45 },
          B: { left: "D", right: "E", x: 155, y: 130 },
          C: { left: "F", right: null, x: 365, y: 130 },
          D: { left: null, right: null, x: 95, y: 230 },
          E: { left: null, right: null, x: 215, y: 230 },
          F: { left: null, right: null, x: 320, y: 230 }
        }
      },
      degenerate: {
        name: "Right-skewed degenerate tree",
        root: "A",
        viewBox: "0 0 520 390",
        nodes: {
          A: { left: null, right: "B", x: 125, y: 45 },
          B: { left: null, right: "C", x: 220, y: 125 },
          C: { left: null, right: "D", x: 315, y: 205 },
          D: { left: null, right: null, x: 410, y: 285 }
        }
      },
      irregular: {
        name: "Irregular tree",
        root: "A",
        viewBox: "0 0 560 420",
        nodes: {
          A: { left: "B", right: "C", x: 280, y: 40 },
          B: { left: null, right: "D", x: 155, y: 125 },
          C: { left: "E", right: "F", x: 405, y: 125 },
          D: { left: null, right: null, x: 205, y: 225 },
          E: { left: "G", right: null, x: 350, y: 225 },
          F: { left: null, right: null, x: 475, y: 225 },
          G: { left: null, right: null, x: 310, y: 310 }
        }
      },
      larger: {
        name: "Larger irregular tree",
        root: "A",
        viewBox: "0 0 680 390",
        nodes: {
          A: { left: "B", right: "C", x: 340, y: 38 },
          B: { left: "D", right: "E", x: 180, y: 120 },
          C: { left: "F", right: "G", x: 500, y: 120 },
          D: { left: "H", right: null, x: 95, y: 210 },
          E: { left: "I", right: "J", x: 255, y: 210 },
          F: { left: null, right: "K", x: 425, y: 210 },
          G: { left: "L", right: "M", x: 585, y: 210 },
          H: { left: null, right: null, x: 55, y: 310 },
          I: { left: null, right: null, x: 215, y: 310 },
          J: { left: null, right: null, x: 295, y: 310 },
          K: { left: null, right: null, x: 465, y: 310 },
          L: { left: null, right: null, x: 545, y: 310 },
          M: { left: null, right: null, x: 625, y: 310 }
        }
      }
    };

    const ALGORITHMS = {
      size: {
        name: "Count nodes",
        functionName: "size",
        resultLabel: "size",
        pseudocode: [
          { id: "header", html: "size(node):" },
          { id: "nullCheck", html: "    if node = null:" },
          { id: "baseReturn", html: "        return 0" },
          {
            id: "combineReturn",
            html: "    return 1 + <span class=\"code-token\" data-token=\"leftCall\">size(node.left)</span> + <span class=\"code-token\" data-token=\"rightCall\">size(node.right)</span>"
          }
        ]
      },
      height: {
        name: "Compute height",
        functionName: "height",
        resultLabel: "height",
        pseudocode: [
          { id: "header", html: "height(node):" },
          { id: "nullCheck", html: "    if node = null:" },
          { id: "baseReturn", html: "        return -1" },
          {
            id: "combineReturn",
            html: "    return 1 + max(<span class=\"code-token\" data-token=\"leftCall\">height(node.left)</span>, <span class=\"code-token\" data-token=\"rightCall\">height(node.right)</span>)"
          }
        ]
      },
      leaves: {
        name: "Count leaves",
        functionName: "countLeaves",
        resultLabel: "leaves",
        pseudocode: [
          { id: "header", html: "countLeaves(node):" },
          { id: "nullCheck", html: "    if node = null:" },
          { id: "baseReturn", html: "        return 0" },
          { id: "leafCheck", html: "    if node.left = null and node.right = null:" },
          { id: "leafReturn", html: "        return 1" },
          {
            id: "combineReturn",
            html: "    return <span class=\"code-token\" data-token=\"leftCall\">countLeaves(node.left)</span> + <span class=\"code-token\" data-token=\"rightCall\">countLeaves(node.right)</span>"
          }
        ]
      },
      twoChildren: {
        name: "Count nodes with two children",
        functionName: "twoChildCount",
        resultLabel: "two-child count",
        pseudocode: [
          { id: "header", html: "twoChildCount(node):" },
          { id: "nullCheck", html: "    if node = null:" },
          { id: "baseReturn", html: "        return 0" },
          { id: "twoCheck", html: "    if node.left != null and node.right != null:" },
          { id: "rootOne", html: "        rootCount = 1" },
          { id: "elseLine", html: "    else:" },
          { id: "rootZero", html: "        rootCount = 0" },
          {
            id: "combineReturn",
            html: "    return rootCount + <span class=\"code-token\" data-token=\"leftCall\">twoChildCount(node.left)</span> + <span class=\"code-token\" data-token=\"rightCall\">twoChildCount(node.right)</span>"
          }
        ]
      }
    };

    const algorithmSelect = document.getElementById("algorithmSelect");
    const treeSelect = document.getElementById("treeSelect");
    const startSelect = document.getElementById("startSelect");
    const restartButton = document.getElementById("restartButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const playButton = document.getElementById("playButton");
    const speedSelect = document.getElementById("speedSelect");
    const commentary = document.getElementById("commentary");
    const treeSvg = document.getElementById("treeSvg");
    const treeDescription = document.getElementById("treeDescription");
    const stepCounter = document.getElementById("stepCounter");
    const computation = document.getElementById("computation");
    const resultBox = document.getElementById("resultBox");
    const callStack = document.getElementById("callStack");
    const pseudocode = document.getElementById("pseudocode");

    let steps = [];
    let currentStep = 0;
    let playTimer = null;
    let currentTree = null;
    let currentAlgorithm = null;
    let startingNode = null;
    let subtreeNodes = new Set();

    function cloneFrames(frames) {
      return frames.map((frame) => ({ ...frame }));
    }

    function copyObject(object) {
      return Object.assign({}, object);
    }

    function populateStartNodes() {
      const tree = TREES[treeSelect.value];
      startSelect.innerHTML = "";
      Object.keys(tree.nodes).forEach((nodeId) => {
        const option = document.createElement("option");
        option.value = nodeId;
        option.textContent = nodeId === tree.root ? nodeId + " (whole tree)" : nodeId + " (subtree rooted at " + nodeId + ")";
        startSelect.appendChild(option);
      });
      startSelect.value = tree.root;
    }

    function collectSubtree(tree, rootId, result) {
      if (rootId === null || result.has(rootId)) {
        return;
      }
      result.add(rootId);
      const node = tree.nodes[rootId];
      collectSubtree(tree, node.left, result);
      collectSubtree(tree, node.right, result);
    }

    function parentMap(tree) {
      const map = {};
      Object.keys(tree.nodes).forEach((nodeId) => {
        const node = tree.nodes[nodeId];
        if (node.left !== null) {
          map[node.left] = { parent: nodeId, side: "left" };
        }
        if (node.right !== null) {
          map[node.right] = { parent: nodeId, side: "right" };
        }
      });
      return map;
    }

    function nodeIsLeaf(tree, nodeId) {
      const node = tree.nodes[nodeId];
      return node.left === null && node.right === null;
    }

    function frameArgument(nodeId, from) {
      if (nodeId !== null) {
        return nodeId;
      }
      if (!from) {
        return "null";
      }
      return "null (" + from.parent + "." + from.side + ")";
    }

    function makeBuilder(tree, algorithmKey, rootId) {
      const algorithm = ALGORITHMS[algorithmKey];
      const builder = {
        tree,
        algorithmKey,
        algorithm,
        rootId,
        stack: [],
        returns: {},
        completed: new Set(),
        steps: []
      };

      builder.addStep = function addStep(options) {
        const currentFrame = builder.stack.length > 0 ? builder.stack[builder.stack.length - 1] : null;
        builder.steps.push({
          message: options.message || "",
          computation: options.computation || "",
          highlight: options.highlight || [],
          currentNode: options.currentNode !== undefined ? options.currentNode : (currentFrame ? currentFrame.node : null),
          nullFrom: options.nullFrom || null,
          stack: cloneFrames(builder.stack),
          returns: copyObject(builder.returns),
          completed: Array.from(builder.completed),
          finalResult: options.finalResult,
          done: options.done || false
        });
      };

      return builder;
    }

    function setReturned(builder, frame, nodeId, value) {
      frame.status = "returned";
      frame.result = value;
      if (nodeId !== null) {
        builder.returns[nodeId] = value;
        builder.completed.add(nodeId);
      }
    }

    function simulate(builder, nodeId, from, isRootCall) {
      const algorithm = builder.algorithm;
      const functionName = algorithm.functionName;
      const frame = {
        node: nodeId,
        argument: frameArgument(nodeId, from),
        leftValue: null,
        rightValue: null,
        rootCount: null,
        status: "active",
        result: null
      };
      builder.stack.push(frame);

      builder.addStep({
        message: "Call " + functionName + "(" + frame.argument + ").",
        computation: "<code>" + functionName + "(" + frame.argument + ")</code>",
        highlight: ["line:header"],
        currentNode: nodeId,
        nullFrom: nodeId === null ? from : null
      });

      builder.addStep({
        message: nodeId === null
          ? "The argument is null, so the base case applies."
          : "Check whether the current node reference is null.",
        computation: nodeId === null
          ? "<code>node = null</code>"
          : "<code>node = " + nodeId + ", so node != null</code>",
        highlight: ["line:nullCheck"],
        currentNode: nodeId,
        nullFrom: nodeId === null ? from : null
      });

      if (nodeId === null) {
        const baseValue = builder.algorithmKey === "height" ? -1 : 0;
        setReturned(builder, frame, null, baseValue);
        builder.addStep({
          message: "Return " + baseValue + " for the empty subtree.",
          computation: "<code>" + functionName + "(null) = " + baseValue + "</code>",
          highlight: ["line:baseReturn"],
          currentNode: null,
          nullFrom: from
        });
        builder.stack.pop();
        return baseValue;
      }

      const node = builder.tree.nodes[nodeId];

      if (builder.algorithmKey === "leaves") {
        const leaf = nodeIsLeaf(builder.tree, nodeId);
        builder.addStep({
          message: leaf
            ? nodeId + " has no children, so it is a leaf."
            : nodeId + " has at least one child, so it is not a leaf.",
          computation: leaf
            ? "<code>node.left = null and node.right = null</code>"
            : "<code>at least one child reference is non-null</code>",
          highlight: ["line:leafCheck"],
          currentNode: nodeId
        });
        if (leaf) {
          setReturned(builder, frame, nodeId, 1);
          builder.addStep({
            message: "Count " + nodeId + " as one leaf and return 1.",
            computation: "<code>countLeaves(" + nodeId + ") = 1</code>",
            highlight: ["line:leafReturn"],
            currentNode: nodeId
          });
          if (!isRootCall) {
            builder.stack.pop();
          }
          return 1;
        }
      }

      if (builder.algorithmKey === "twoChildren") {
        const hasTwo = node.left !== null && node.right !== null;
        builder.addStep({
          message: hasTwo
            ? nodeId + " has both a left and a right child."
            : nodeId + " does not have two children.",
          computation: hasTwo
            ? "<code>both child references are non-null</code>"
            : "<code>one or both child references are null</code>",
          highlight: ["line:twoCheck"],
          currentNode: nodeId
        });
        frame.rootCount = hasTwo ? 1 : 0;
        builder.addStep({
          message: hasTwo
            ? "Set rootCount to 1 because the current node has two children."
            : "Set rootCount to 0 because the current node does not have two children.",
          computation: "<code>rootCount = " + frame.rootCount + "</code>",
          highlight: [hasTwo ? "line:rootOne" : "line:rootZero"],
          currentNode: nodeId
        });
      }

      const leftName = node.left === null ? "null" : node.left;
      builder.addStep({
        message: "Recursively process the left subtree of " + nodeId + ".",
        computation: "<code>call " + functionName + "(" + leftName + ")</code>",
        highlight: ["token:leftCall"],
        currentNode: nodeId
      });
      const leftValue = simulate(builder, node.left, { parent: nodeId, side: "left" }, false);
      frame.leftValue = leftValue;
      frame.status = "active";
      builder.addStep({
        message: "The left subtree of " + nodeId + " returned " + leftValue + ".",
        computation: "<code>left result = " + leftValue + "</code>",
        highlight: ["token:leftCall"],
        currentNode: nodeId
      });

      const rightName = node.right === null ? "null" : node.right;
      builder.addStep({
        message: "Recursively process the right subtree of " + nodeId + ".",
        computation: "<code>call " + functionName + "(" + rightName + ")</code>",
        highlight: ["token:rightCall"],
        currentNode: nodeId
      });
      const rightValue = simulate(builder, node.right, { parent: nodeId, side: "right" }, false);
      frame.rightValue = rightValue;
      frame.status = "active";
      builder.addStep({
        message: "The right subtree of " + nodeId + " returned " + rightValue + ".",
        computation: "<code>right result = " + rightValue + "</code>",
        highlight: ["token:rightCall"],
        currentNode: nodeId
      });

      let result;
      let formula;
      if (builder.algorithmKey === "size") {
        result = 1 + leftValue + rightValue;
        formula = "size(" + nodeId + ") = 1 + " + leftValue + " + " + rightValue + " = " + result;
      } else if (builder.algorithmKey === "height") {
        result = 1 + Math.max(leftValue, rightValue);
        formula = "height(" + nodeId + ") = 1 + max(" + leftValue + ", " + rightValue + ") = " + result;
      } else if (builder.algorithmKey === "leaves") {
        result = leftValue + rightValue;
        formula = "countLeaves(" + nodeId + ") = " + leftValue + " + " + rightValue + " = " + result;
      } else {
        result = frame.rootCount + leftValue + rightValue;
        formula = "twoChildCount(" + nodeId + ") = " + frame.rootCount + " + " + leftValue + " + " + rightValue + " = " + result;
      }

      setReturned(builder, frame, nodeId, result);
      builder.addStep({
        message: "Combine the results at " + nodeId + " and return " + result + ".",
        computation: "<code>" + formula + "</code>",
        highlight: ["line:combineReturn"],
        currentNode: nodeId
      });

      if (!isRootCall) {
        builder.stack.pop();
      }
      return result;
    }

    function buildSteps() {
      stopPlaying();
      currentTree = TREES[treeSelect.value];
      currentAlgorithm = ALGORITHMS[algorithmSelect.value];
      startingNode = startSelect.value;
      subtreeNodes = new Set();
      collectSubtree(currentTree, startingNode, subtreeNodes);

      const builder = makeBuilder(currentTree, algorithmSelect.value, startingNode);
      const result = simulate(builder, startingNode, null, true);
      const finalState = builder.steps[builder.steps.length - 1];
      builder.steps.push({
        ...finalState,
        message: "Done. " + currentAlgorithm.functionName + "(" + startingNode + ") returned " + result + ".",
        computation: "<code>final result = " + result + "</code>",
        finalResult: result,
        done: true,
        highlight: []
      });

      steps = builder.steps;
      currentStep = 0;
      renderPseudocode();
      renderStep();
    }

    function renderPseudocode() {
      pseudocode.innerHTML = "";
      currentAlgorithm.pseudocode.forEach((line, index) => {
        const row = document.createElement("div");
        row.className = "code-line";
        row.dataset.line = line.id;

        const number = document.createElement("span");
        number.className = "line-number";
        number.textContent = String(index + 1);

        const content = document.createElement("span");
        content.className = "line-content";
        content.innerHTML = line.html;

        row.appendChild(number);
        row.appendChild(content);
        pseudocode.appendChild(row);
      });
    }

    function applyPseudocodeHighlight(targets) {
      pseudocode.querySelectorAll(".highlight").forEach((element) => {
        element.classList.remove("highlight");
      });

      targets.forEach((target) => {
        const parts = target.split(":");
        if (parts[0] === "line") {
          const row = pseudocode.querySelector('[data-line="' + parts[1] + '"]');
          if (row) {
            row.classList.add("highlight");
          }
        } else if (parts[0] === "token") {
          const token = pseudocode.querySelector('[data-token="' + parts[1] + '"]');
          if (token) {
            token.classList.add("highlight");
          }
        }
      });
    }

    function createSvgElement(name, attributes) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.keys(attributes).forEach((key) => {
        element.setAttribute(key, String(attributes[key]));
      });
      return element;
    }

    function nullPosition(tree, from) {
      if (!from || !tree.nodes[from.parent]) {
        return { x: 60, y: 55 };
      }
      const parent = tree.nodes[from.parent];
      const direction = from.side === "left" ? -1 : 1;
      return {
        x: parent.x + direction * 52,
        y: parent.y + 68
      };
    }

    function renderTree(step) {
      treeSvg.innerHTML = "";
      treeSvg.setAttribute("viewBox", currentTree.viewBox);

      const title = createSvgElement("title", { id: "treeTitle" });
      title.textContent = currentTree.name + ", starting at node " + startingNode;
      treeSvg.appendChild(title);

      const description = createSvgElement("desc", { id: "treeDescription" });
      description.textContent = step.message;
      treeSvg.appendChild(description);

      const parents = parentMap(currentTree);
      const stackNodeIds = new Set(step.stack.filter((frame) => frame.node !== null).map((frame) => frame.node));
      const completedIds = new Set(step.completed);

      Object.keys(currentTree.nodes).forEach((nodeId) => {
        const node = currentTree.nodes[nodeId];
        ["left", "right"].forEach((side) => {
          const childId = node[side];
          if (childId === null) {
            return;
          }
          const child = currentTree.nodes[childId];
          const edge = createSvgElement("line", {
            x1: node.x,
            y1: node.y,
            x2: child.x,
            y2: child.y,
            class: "edge" + (subtreeNodes.has(nodeId) && subtreeNodes.has(childId) ? "" : " outside-subtree")
          });
          treeSvg.appendChild(edge);
        });
      });

      Object.keys(currentTree.nodes).forEach((nodeId) => {
        const node = currentTree.nodes[nodeId];
        const groupClasses = ["tree-node"];
        if (!subtreeNodes.has(nodeId)) {
          groupClasses.push("outside-subtree");
        }
        if (stackNodeIds.has(nodeId)) {
          groupClasses.push("in-stack");
        }
        if (completedIds.has(nodeId)) {
          groupClasses.push("completed");
        }
        if (step.currentNode === nodeId) {
          groupClasses.push("current");
        }

        const group = createSvgElement("g", {
          class: groupClasses.join(" "),
          "aria-label": "node " + nodeId
        });

        if (nodeId === startingNode) {
          group.appendChild(createSvgElement("circle", {
            cx: node.x,
            cy: node.y,
            r: 25,
            class: "start-ring"
          }));
        }

        group.appendChild(createSvgElement("circle", {
          cx: node.x,
          cy: node.y,
          r: 19
        }));

        const label = createSvgElement("text", {
          x: node.x,
          y: node.y + 1,
          class: "node-label"
        });
        label.textContent = nodeId;
        group.appendChild(label);

        if (Object.prototype.hasOwnProperty.call(step.returns, nodeId)) {
          const returnLabel = createSvgElement("text", {
            x: node.x,
            y: node.y + 37,
            class: "return-label"
          });
          returnLabel.textContent = "returns " + step.returns[nodeId];
          group.appendChild(returnLabel);
        }

        treeSvg.appendChild(group);
      });

      if (step.currentNode === null && step.nullFrom) {
        const position = nullPosition(currentTree, step.nullFrom);
        const parent = currentTree.nodes[step.nullFrom.parent];
        treeSvg.appendChild(createSvgElement("line", {
          x1: parent.x,
          y1: parent.y,
          x2: position.x,
          y2: position.y,
          stroke: "#b45309",
          "stroke-width": 1.5,
          "stroke-dasharray": "4 3"
        }));
        const nullGroup = createSvgElement("g", { class: "null-marker" });
        nullGroup.appendChild(createSvgElement("ellipse", {
          cx: position.x,
          cy: position.y,
          rx: 25,
          ry: 15
        }));
        const nullText = createSvgElement("text", {
          x: position.x,
          y: position.y + 1
        });
        nullText.textContent = "null";
        nullGroup.appendChild(nullText);
        treeSvg.appendChild(nullGroup);
      }
    }

    function localText(frame) {
      const values = [];
      if (frame.rootCount !== null) {
        values.push("rootCount=" + frame.rootCount);
      }
      if (frame.leftValue !== null) {
        values.push("left=" + frame.leftValue);
      }
      if (frame.rightValue !== null) {
        values.push("right=" + frame.rightValue);
      }
      return values.join(", ");
    }

    function renderStack(step) {
      callStack.innerHTML = "";
      if (step.stack.length === 0) {
        callStack.innerHTML = '<div class="stack-empty">The call stack is empty.</div>';
        return;
      }

      step.stack.forEach((frame, index) => {
        const item = document.createElement("div");
        const isCurrent = index === step.stack.length - 1 && frame.status !== "returned";
        item.className = "stack-frame" + (isCurrent ? " current" : "") + (frame.status === "returned" ? " returned" : "");
        item.style.marginLeft = Math.min(index * 15, 75) + "px";

        const name = document.createElement("div");
        name.textContent = currentAlgorithm.functionName + "(" + frame.argument + ")" + (frame.status === "returned" ? " -> " + frame.result : "");
        item.appendChild(name);

        const locals = localText(frame);
        if (locals !== "") {
          const details = document.createElement("div");
          details.className = "frame-locals";
          details.textContent = locals;
          item.appendChild(details);
        }

        callStack.appendChild(item);
      });
    }

    function finalResultText(step) {
      if (step.done) {
        return '<strong>Final result:</strong> <code>' + currentAlgorithm.functionName + '(' + startingNode + ') = ' + step.finalResult + '</code>';
      }

      const returnedCount = Object.keys(step.returns).length;
      if (returnedCount === 0) {
        return "No non-null call has returned yet.";
      }
      return returnedCount + " non-null call" + (returnedCount === 1 ? " has" : "s have") + " returned so far.";
    }

    function renderStep() {
      if (steps.length === 0) {
        return;
      }
      const step = steps[currentStep];
      commentary.textContent = step.message;
      stepCounter.textContent = "Step " + (currentStep + 1) + " of " + steps.length;
      computation.innerHTML = step.computation || "&nbsp;";
      resultBox.innerHTML = finalResultText(step);
      renderTree(step);
      renderStack(step);
      applyPseudocodeHighlight(step.highlight);

      previousButton.disabled = currentStep === 0;
      nextButton.disabled = currentStep === steps.length - 1;
      if (currentStep === steps.length - 1) {
        stopPlaying();
      }
      notifyParentOfHeight();
    }

    function previousStep() {
      if (currentStep > 0) {
        currentStep -= 1;
        renderStep();
      }
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep += 1;
        renderStep();
      }
    }

    function startPlaying() {
      if (playTimer !== null) {
        return;
      }
      if (currentStep === steps.length - 1) {
        currentStep = 0;
        renderStep();
      }
      playButton.textContent = "Pause";
      playTimer = window.setInterval(() => {
        if (currentStep >= steps.length - 1) {
          stopPlaying();
          return;
        }
        currentStep += 1;
        renderStep();
      }, Number(speedSelect.value));
    }

    function stopPlaying() {
      if (playTimer !== null) {
        window.clearInterval(playTimer);
        playTimer = null;
      }
      playButton.textContent = "Play";
    }

    function togglePlay() {
      if (playTimer === null) {
        startPlaying();
      } else {
        stopPlaying();
      }
    }

    function notifyParentOfHeight() {
      if (window.parent === window) {
        return;
      }
      window.parent.postMessage({
        type: "demo-height",
        height: document.documentElement.scrollHeight
      }, "*");
    }

    algorithmSelect.addEventListener("change", buildSteps);
    treeSelect.addEventListener("change", () => {
      populateStartNodes();
      buildSteps();
    });
    startSelect.addEventListener("change", buildSteps);
    restartButton.addEventListener("click", buildSteps);
    previousButton.addEventListener("click", previousStep);
    nextButton.addEventListener("click", nextStep);
    playButton.addEventListener("click", togglePlay);
    speedSelect.addEventListener("change", () => {
      if (playTimer !== null) {
        stopPlaying();
        startPlaying();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.tagName === "SELECT" || event.target.tagName === "BUTTON") {
        return;
      }
      if (event.key === "ArrowLeft") {
        previousStep();
      } else if (event.key === "ArrowRight") {
        nextStep();
      } else if (event.key === " ") {
        event.preventDefault();
        togglePlay();
      }
    });

    window.addEventListener("resize", notifyParentOfHeight);

    populateStartNodes();
    buildSteps();
  </script>
</body>
</html>
