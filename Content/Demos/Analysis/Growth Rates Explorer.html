<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/DAIADS/scripts/content-page-routing.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/DAIADS/scripts/demoScripts.js"></script>
  <link rel="stylesheet" href="/DAIADS/css/style.css">
  <link rel="stylesheet" href="/DAIADS/css/demo.css">
  <title>Growth Rates Explorer</title>
  <style>
    :root {
      --border: #cbd5e1;
      --soft: #f8fafc;
      --ink: #1f2937;
      --muted: #64748b;
    }

    body.no-tooltips {
      margin: 0;
      color: var(--ink);
      background: #ffffff;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
    }

    .explorer {
      display: grid;
      gap: 0.75rem;
    }

    .top-controls,
    .function-panel,
    .comment {
      border: 1px solid var(--border);
      background: var(--soft);
      border-radius: 6px;
      padding: 0.65rem;
    }

    .top-controls {
      display: grid;
      grid-template-columns: 16.25rem 6.5rem repeat(2, 11rem);
      gap: 0.6rem;
      align-items: end;
      justify-content: start;
    }

    label {
      display: grid;
      gap: 0.25rem;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .explorer input,
    .explorer select {
      font: inherit;
      min-width: 0;
      box-sizing: border-box;
      margin: 0;
      padding: 0.35rem;
    }

    .explorer input[type="checkbox"],
    .explorer input[type="range"] {
      padding: 0;
    }

    .explorer input[type="number"] {
      width: 4.125rem;
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(6rem, 1fr) 4.75rem;
      gap: 0.35rem;
      align-items: center;
    }

    .comment {
      line-height: 1.4;
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .chart-wrap {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      overflow: hidden;
    }

    #chart {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 430;
    }

    .explorer a {
      text-decoration: underline;
    }

    .function-panel {
      overflow-x: visible;
    }

    .parser-note {
      margin: 0 0 0.55rem;
      color: #475569;
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .function-editor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(19rem, 1fr));
      grid-template-rows: repeat(3, auto);
      grid-auto-flow: column;
      gap: 0.45rem 0.75rem;
    }

    .function-row {
      display: grid;
      grid-template-columns: 1.35rem 0.9rem minmax(7rem, 1fr) auto;
      gap: 0.35rem;
      align-items: center;
      min-width: 0;
    }

    .function-row {
      padding: 0.4rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #ffffff;
    }

    .function-row.invalid .row-expression {
      border-color: #dc2626;
      background: #fff1f2;
    }

    .swatch {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.18);
      display: inline-block;
      flex: 0 0 auto;
    }

    .row-expression {
      width: 100%;
      padding: 0.3rem;
    }

    .row-values {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      justify-content: flex-end;
      min-width: 8.4rem;
    }

    .value-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 0.25rem;
      white-space: nowrap;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #f8fafc;
      padding: 0.16rem 0.42rem;
      font-size: 0.78rem;
    }

    .value-label {
      color: var(--muted);
      font-weight: 700;
    }

    .value-number {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .row-error {
      display: none;
      grid-column: 3 / -1;
      color: #b91c1c;
      font-size: 0.78rem;
      line-height: 1.15;
    }

    .function-row.invalid .row-error {
      display: block;
    }

    .axis-label {
      fill: #475569;
      font-size: 12px;
    }

    .tick-label {
      fill: #64748b;
      font-size: 11px;
    }

    .grid-line {
      stroke: #e2e8f0;
      stroke-width: 1;
    }

    .axis-line {
      stroke: #334155;
      stroke-width: 1.5;
    }

    .series-path {
      fill: none;
      stroke-width: 2.4;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .marker-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }

    .svg-legend-bg {
      fill: rgba(255,255,255,0.88);
      stroke: #cbd5e1;
      stroke-width: 1;
    }

    .svg-legend-text {
      fill: #334155;
      font-size: 22px;
      dominant-baseline: middle;
    }

    @media (max-width: 680px) {
      body.no-tooltips {
        padding: 4px;
      }

      h1 {
        font-size: 1.15rem;
      }

      .top-controls,
      .function-panel,
      .comment {
        padding: 0.5rem;
      }

      .top-controls,
      .function-editor-grid {
        grid-template-columns: 1fr;
      }

      .function-editor-grid {
        grid-template-rows: none;
        grid-auto-flow: row;
      }

      .function-row {
        grid-template-columns: 1.35rem 0.9rem minmax(8rem, 1fr);
      }

      .row-values,
      .row-error {
        grid-column: 3 / -1;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body class="no-tooltips">
  <h2>Growth Rates Explorer</h2>

  <main class="explorer">
    <div class="top-controls">
      <label>
        Preset
        <select id="preset"></select>
      </label>

      <label>
        y-axis
        <select id="scale">
          <option value="linear">Linear</option>
          <option value="log">Logarithmic</option>
        </select>
      </label>

      <label>
        Maximum n
        <span class="range-row">
          <input id="maxNRange" type="range" min="5" max="10000" value="20">
          <input id="maxN" type="number" min="5" max="10000" value="20">
        </span>
      </label>

      <label>
        Selected n
        <span class="range-row">
          <input id="focusNRange" type="range" min="1" max="20" value="20">
          <input id="focusN" type="number" min="1" max="20" value="20">
        </span>
      </label>
    </div>

    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 900 430" role="img" aria-label="Line chart comparing selected growth-rate functions">
        <title id="chartTitle">Growth-rate plot</title>
        <desc id="chartDesc">A line chart comparing selected growth-rate functions.</desc>
      </svg>
    </div>

    <div id="comment" class="comment"></div>

    <div class="function-panel">
      <p class="parser-note">
        Supported forms include <code>n</code>, <code>n^2</code>, <code>300000n^2 + 300n</code>,
        <code>1.5^n</code>, <code>log_2 n</code>, <code>ln n</code>, <code>sqrt n</code>, <code>(log_2 n)^2</code>, and <code>n log_2 n</code>.
        Use <code>n</code> or <code>x</code> for the input; plain <code>log</code> means base 2.
      </p>
      <div id="functionRows" class="function-editor-grid"></div>
    </div>

    <div>If you are viewing this demo by itself, see the <a href='?path=Analysis/Common%20Growth%20Rates'>Common Growth Rates</a>
    page Exercise 1 for the answers.</div>
  </main>

  <script>
    const COLORS = ['#2563eb', '#dc2626', '#059669', '#7c3aed', '#ea580c', '#0891b2'];

    const emptyRow = (i) => ({
      enabled: false,
      expr: '',
      color: COLORS[i]
    });

const presets = [
  {
    name: 'Constant factors versus growth rate',
    maxN: 5,
    focusN: 5,
    scale: 'linear',
    comment: 'Compare <em>n<sup>2</sup></em>, <em>10n</em>, and <em>100n</em> on 1 &le; <em>n</em> &le; 5. '
      + 'Then use the arrows on the input box to raise <strong>Maximum n</strong> until '
      + '<em>n</em> reaches 150. What happened and when did it happen? Why did it happen? What can you learn from it?',
    rows: ['n^2', '10n', '100n']
  },
  {
    name: 'Large constants versus growth class',
    maxN: 20,
    focusN: 20,
    scale: 'linear',
    comment: 'Compare <em>10000n</em>, <em>100n<sup>2</sup></em>, and <em>n<sup>3</sup></em> on 1 &le; <em>n</em> &le; 20. '
      + 'Then use the arrows on the input box to raise <strong>Maximum n</strong> until '
      + '<em>n</em> reaches 150. What happened and when did it happen? Why did it happen? What can you learn from it?',
    rows: ['10000n', '100n^2', 'n^3']
  },
  {
    name: 'Lower-order terms',
    maxN: 10,
    focusN: 10,
    scale: 'linear',
    comment: 'Compare <em>n<sup>3</sup></em>, <em>n<sup>3</sup>+12345</em>, and <em>n<sup>3</sup>+100n<sup>2</sup></em> on 1 &le; <em>n</em> &le; 10. '
      + 'Then use the arrows on the input box to raise <strong>Maximum n</strong> until '
      + '<em>n</em> reaches 500. Then set it to the maximum value. '
      + 'At two values of <em>n</em> you should have noticed important changes. What were they? Why did it happen? What can you learn from it?',
    rows: ['n^3', 'n^3 + 12345', 'n^3 + 100n^2']
  },
  {
    name: 'Do not judge too quickly',
    maxN: 10,
    focusN: 10,
    scale: 'linear',
    comment: 'Compare <em>2<sup>n</sup></em>, <em>300n<sup>3</sup></em>, and <em>5000n<sup>2</sup></em> on 1 &le; <em>n</em> &le; 10. '
      + 'Then use the arrows on the input box to <em>slowly</em> raise <strong>Maximum n</strong> until <em>n</em> reaches 25. '
      + 'What happened and when did it happen? Why did it happen? What can you learn from it?',
    rows: ['2^n', '300n^3', '5000n^2']
  },
  {
    name: 'Logarithmic growth',
    maxN: 100,
    focusN: 100,
    scale: 'linear',
    comment: 'Compare <em>log<sub>2</sub> n</em>, <em>&radic;n</em>, <em>n</em>, and <em>n log<sub>2</sub> n</em> on 1 &le; <em>n</em> &le; 100. '
      + 'Then set <strong>Maximum n</strong> to 10000. Which functions remain relatively small, and which pull away? '
      +'Do the functions behave as you expect?',
    rows: ['log_2 n', 'sqrt n', 'n', 'n log_2 n']
  },
  {
    name: 'Same class, different appearance',
    maxN: 100,
    focusN: 100,
    scale: 'linear',
    comment: 'Compare <em>n<sup>2</sup></em>, <em>n<sup>2</sup>+n</em>, <em>n<sup>2</sup>+1000n</em>, and <em>5n<sup>2</sup></em> on 1 &le; <em>n</em> &le; 100. '
      +'You should have one interesting observation immediately. What do you notice that might be unexpected? '  
      + 'Then use the arrows on the input box to raise <strong>Maximum n</strong> until <em>n</em> reaches 300. '
      +' What happened and at what value of <em>n</em> did it happen? '
      + 'Now use the slider to increase <strong>Maximum n</strong> to 10000. '
      + 'What do you notice now? Explain why the graph makes sense and what the implications are.',
    rows: ['n^2', 'n^2 + n', 'n^2 + 1000n', '5n^2']
  },
  {
    name: 'Exponential bases',
    maxN: 10,
    focusN: 10,
    scale: 'linear',
    comment: 'Compare <em>1.001<sup>n</sup></em>, <em>1.1<sup>n</sup></em>, <em>1.5<sup>n</sup></em>, and <em>2<sup>n</sup></em> on 1 &le; <em>n</em> &le; 10. '
      + 'Then use the arrows on the input box to <em>slowly</em> raise <strong>Maximum n</strong> until <em>n</em> reaches 25. '
      +'What do you notice about the relative values of the functions? Now uncheck the box next to <em>2<sup>n</sup></em> and then '
      +'uncheck the box next to <em>1.5<sup>n</sup></em>. What happened? What do you think this means in terms of the relative growth '
      +'rates of these functions?',
    rows: ['1.001^n', '1.1^n', '1.5^n', '2^n']
  },
  {
    name: 'Logarithm bases',
    maxN: 100,
    focusN: 100,
    scale: 'linear',
    comment: 'Compare <em>log<sub>2</sub> n</em>, <em>ln n</em>, and <em>log<sub>10</sub> n</em> on 1 &le; <em>n</em> &le; 100. '
      + 'Then use the slider to set <strong>Maximum n</strong> to 10000. '
      +' What happens to the relative positions of the 3 functions? What does that imply?',
    rows: ['log_2 n', 'ln n', 'log_10 n']
  },
  {
    name: 'Powers of logarithms',
    maxN: 10,
    focusN: 10,
    scale: 'linear',
    comment: 'Compare <em>log<sub>2</sub> n</em>, <em>(log<sub>2</sub> n)<sup>2</sup></em>, <em>(log<sub>2</sub> n)<sup>3</sup></em>, and <em>n</em> on 1 &le; <em>n</em> &le; 10. '
      + 'Write down the relative order of the functions. '
      + 'Does the order match your intuition? If not, write down what you think the correct order is.'
      + 'Then use the arrows on the input box to raise <strong>Maximum n</strong> until <em>n</em> reaches 100. '
      + 'What changed? Is this the final correct order? '
      + 'Now use the slider to set <strong>Maximum n</strong> to 10000. '
      + 'What changed? Make comments on what you learned from this.',
    rows: ['log_2 n', '(log_2 n)^2', '(log_2 n)^3', 'n']
  },
  {
    name: 'Enter my own',
    maxN: 100,
    focusN: 100,
    scale: 'linear',
    custom: true,
    comment: 'Edit the function rows below, turn rows on or off, and adjust <strong>Maximum n</strong> and <strong>Selected n</strong> to test your own comparisons.',
    rows: []
  }
];

    let rows = [];

    const presetEl = document.getElementById('preset');
    const scaleEl = document.getElementById('scale');
    const maxNEl = document.getElementById('maxN');
    const maxNRangeEl = document.getElementById('maxNRange');
    const focusNEl = document.getElementById('focusN');
    const focusNRangeEl = document.getElementById('focusNRange');
    const functionRowsEl = document.getElementById('functionRows');
    const chartEl = document.getElementById('chart');
    const commentEl = document.getElementById('comment');

    function cloneRows(presetRows) {
      const next = Array.from({ length: 6 }, (_, i) => emptyRow(i));
      presetRows.forEach((expr, i) => {
        next[i] = {
          ...next[i],
          enabled: true,
          expr,
          color: COLORS[i]
        };
      });
      return next;
    }

    function clampNumber(value, min, max, fallback) {
      const num = Number(value);
      if (!Number.isFinite(num)) return fallback;
      return Math.max(min, Math.min(max, num));
    }

    function setMaxN(value) {
      const previousMax = Number(maxNRangeEl.value) || 20;
      const previousFocus = Number(focusNRangeEl.value) || previousMax;
      const shouldFollowMax = previousFocus === previousMax;
      const maxN = Math.round(clampNumber(value, 5, 10000, 20));
      maxNEl.value = maxN;
      maxNRangeEl.value = maxN;
      focusNEl.max = maxN;
      focusNRangeEl.max = maxN;
      if (Number(focusNEl.value) > maxN || shouldFollowMax) {
        focusNEl.value = maxN;
        focusNRangeEl.value = maxN;
      }
    }

    function setFocusN(value) {
      const maxN = Number(maxNEl.value);
      const focusN = Math.round(clampNumber(value, 1, maxN, maxN));
      focusNEl.value = focusN;
      focusNRangeEl.value = focusN;
    }

    function handleMaxNInput() {
      const value = maxNEl.value.trim();
      const num = Number(value);
      if (!value || !Number.isFinite(num) || num < 5 || num > 10000) return;
      setMaxN(value);
      render();
    }

    function commitMaxNInput() {
      setMaxN(maxNEl.value);
      render();
    }

    function handleFocusNInput() {
      const maxN = Number(maxNRangeEl.value);
      const value = focusNEl.value.trim();
      const num = Number(value);
      if (!value || !Number.isFinite(num) || num < 1 || num > maxN) return;
      setFocusN(value);
      render();
    }

    function commitFocusNInput() {
      setFocusN(focusNEl.value);
      render();
    }

    function applyPreset(index) {
      const preset = presets[index];
      rows = cloneRows(preset.rows);
      presetEl.value = String(index);
      scaleEl.value = preset.scale;
      setMaxN(preset.maxN);
      setFocusN(preset.focusN);
      commentEl.innerHTML = preset.comment;
      //commentEl.textContent = preset.comment;
      renderRows();
      render();
    }

    function renderRows() {
      functionRowsEl.innerHTML = rows.map((row, i) => `
        <div class="function-row" data-row="${i}">
          <input class="row-enabled" type="checkbox" aria-label="Show function ${i + 1}" ${row.enabled ? 'checked' : ''}>
          <span class="swatch" style="background:${row.color}"></span>
          <input class="row-expression" type="text" value="${escapeHtml(row.expr)}" aria-label="Function ${i + 1} expression">
          <span class="row-values" aria-label="Function ${i + 1} values">
            <span class="value-chip">
              <span class="value-label" data-focus-label="${i}">n</span>
              <span class="value-number" data-focus-value="${i}">-</span>
            </span>
            <span class="value-chip">
              <span class="value-label" data-max-label="${i}">max</span>
              <span class="value-number" data-max-value="${i}">-</span>
            </span>
          </span>
          <span class="row-error" data-error-for="${i}" aria-live="polite"></span>
        </div>
      `).join('');
    }

    function syncRowFromInput(target) {
      const rowEl = target.closest('.function-row');
      if (!rowEl) return;
      const i = Number(rowEl.dataset.row);
      rows[i] = {
        ...rows[i],
        enabled: rowEl.querySelector('.row-enabled').checked,
        expr: rowEl.querySelector('.row-expression').value
      };
      render();
    }

    function parseRows() {
      return rows.map(row => ({
        row,
        parsed: parseExpression(row.expr)
      }));
    }

    function activeParsedRows(parsedRows) {
      return parsedRows.filter(item => item.row.enabled && item.parsed.ok);
    }

    function render() {
      const maxN = Number(maxNEl.value);
      const focusN = Number(focusNEl.value);
      const scale = scaleEl.value;
      const parsedRows = parseRows();
      updateRowErrors(parsedRows);
      renderChart(maxN, focusN, scale, parsedRows);
      updateRowValues(maxN, focusN, parsedRows);
    }

    function updateRowErrors(parsedRows) {
      parsedRows.forEach((item, i) => {
        const rowEl = functionRowsEl.querySelector(`[data-row="${i}"]`);
        const errorEl = functionRowsEl.querySelector(`[data-error-for="${i}"]`);
        if (!rowEl || !errorEl) return;

        rowEl.classList.toggle('invalid', item.row.enabled && !item.parsed.ok);
        errorEl.textContent = item.row.enabled && !item.parsed.ok ? item.parsed.error : '';
      });
    }

    function updateRowValues(maxN, focusN, parsedRows) {
      parsedRows.forEach((item, i) => {
        const focusLabelEl = functionRowsEl.querySelector(`[data-focus-label="${i}"]`);
        const maxLabelEl = functionRowsEl.querySelector(`[data-max-label="${i}"]`);
        const focusValueEl = functionRowsEl.querySelector(`[data-focus-value="${i}"]`);
        const maxValueEl = functionRowsEl.querySelector(`[data-max-value="${i}"]`);
        if (!focusLabelEl || !maxLabelEl || !focusValueEl || !maxValueEl) return;

        focusLabelEl.textContent = `n=${focusN}`;
        maxLabelEl.textContent = 'max';

        if (!item.row.enabled) {
          focusValueEl.textContent = 'off';
          maxValueEl.textContent = 'off';
          return;
        }

        if (!item.parsed.ok) {
          focusValueEl.textContent = '-';
          maxValueEl.textContent = '-';
          return;
        }

        focusValueEl.textContent = formatValue(valueFor(item, focusN));
        maxValueEl.textContent = formatValue(valueFor(item, maxN));
      });
    }

    function renderChart(maxN, focusN, scale, parsedRows) {
      const margin = { left: 78, right: 26, top: 22, bottom: 48 };
      const width = 900;
      const height = 430;
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const active = activeParsedRows(parsedRows);
      const values = [];

      active.forEach(item => {
        for (let n = 1; n <= maxN; n += 1) {
          const value = valueFor(item, n);
          if (Number.isFinite(value)) values.push(value);
        }
      });

      let yMin = 0;
      let yMax = values.length ? Math.max(...values) : 1;
      if (scale === 'linear') {
        const finiteMin = values.length ? Math.min(...values) : 0;
        yMin = Math.min(0, finiteMin);
        if (yMax <= yMin) yMax = yMin + 1;
        const pad = (yMax - yMin) * 0.08;
        yMax += pad;
      } else {
        const positive = values.filter(v => v > 0);
        const minPositive = positive.length ? Math.min(...positive) : 1;
        const maxPositive = positive.length ? Math.max(...positive) : 10;
        yMin = Math.floor(Math.log10(minPositive));
        yMax = Math.ceil(Math.log10(maxPositive));
        if (yMax <= yMin) yMax = yMin + 1;
      }

      const xFor = n => margin.left + ((n - 1) / Math.max(1, maxN - 1)) * plotW;
      const yFor = value => {
        if (scale === 'log') {
          if (value <= 0) return NaN;
          return margin.top + (1 - ((Math.log10(value) - yMin) / (yMax - yMin))) * plotH;
        }
        return margin.top + (1 - ((value - yMin) / (yMax - yMin))) * plotH;
      };

      const pieces = [];
      pieces.push(`<rect x="0" y="0" width="${width}" height="${height}" fill="#fff"/>`);
      pieces.push(`<rect x="${margin.left}" y="${margin.top}" width="${plotW}" height="${plotH}" fill="#ffffff"/>`);

      const xTicks = makeTicks(1, maxN, 5).map(Math.round);
      const yTicks = scale === 'log'
        ? makeTicks(yMin, yMax, Math.min(6, yMax - yMin + 1)).map(v => Math.round(v))
        : makeTicks(yMin, yMax, 6);

      xTicks.forEach(tick => {
        const x = xFor(tick);
        pieces.push(`<line class="grid-line" x1="${x}" y1="${margin.top}" x2="${x}" y2="${margin.top + plotH}"/>`);
        pieces.push(`<text class="tick-label" x="${x}" y="${height - 24}" text-anchor="middle">${tick}</text>`);
      });

      yTicks.forEach(tick => {
        const raw = scale === 'log' ? Math.pow(10, tick) : tick;
        const y = scale === 'log'
          ? margin.top + (1 - ((tick - yMin) / (yMax - yMin))) * plotH
          : yFor(tick);
        pieces.push(`<line class="grid-line" x1="${margin.left}" y1="${y}" x2="${margin.left + plotW}" y2="${y}"/>`);
        pieces.push(`<text class="tick-label" x="${margin.left - 8}" y="${y + 4}" text-anchor="end">${formatValue(raw)}</text>`);
      });

      pieces.push(`<line class="axis-line" x1="${margin.left}" y1="${margin.top + plotH}" x2="${margin.left + plotW}" y2="${margin.top + plotH}"/>`);
      pieces.push(`<line class="axis-line" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${margin.top + plotH}"/>`);
      pieces.push(`<text class="axis-label" x="${margin.left + plotW / 2}" y="${height - 6}" text-anchor="middle">n</text>`);
      pieces.push(`<text class="axis-label" x="16" y="${margin.top + plotH / 2}" transform="rotate(-90 16 ${margin.top + plotH / 2})" text-anchor="middle">value</text>`);

      active.forEach(item => {
        const path = buildPath(item, maxN, xFor, yFor);
        if (path) {
          pieces.push(`<path class="series-path" d="${path}" stroke="${item.row.color}"/>`);
        }
      });

      const markerX = xFor(focusN);
      pieces.push(`<line class="marker-line" x1="${markerX}" y1="${margin.top}" x2="${markerX}" y2="${margin.top + plotH}"/>`);
      active.forEach(item => {
        const value = valueFor(item, focusN);
        const y = yFor(value);
        if (Number.isFinite(y)) {
          pieces.push(`<circle cx="${markerX}" cy="${y}" r="4" fill="${item.row.color}" stroke="#fff" stroke-width="1.5"/>`);
        }
      });

      pieces.push(renderSvgLegend(active, margin, plotW));
      chartEl.innerHTML = pieces.join('');
    }

    function renderSvgLegend(items, margin, plotW) {
      if (!items.length) return '';

      const labels = items.map(item => item.row.expr || 'blank');
      const rowH = 32;
      const pad = 12;
      const x = margin.left + 12;
      const y = margin.top + 12;
      const width = Math.min(plotW - 24, Math.max(150, Math.max(...labels.map(label => label.length)) * 12 + 54));
      const height = labels.length * rowH + pad * 2;
      const rows = labels.map((label, i) => {
        const cy = y + pad + i * rowH + rowH / 2;
        return `
          <circle cx="${x + pad}" cy="${cy}" r="7" fill="${items[i].row.color}"></circle>
          <text class="svg-legend-text" x="${x + pad + 20}" y="${cy}">${escapeHtml(label)}</text>
        `;
      }).join('');

      return `
        <g class="svg-legend" aria-hidden="true">
          <rect class="svg-legend-bg" x="${x}" y="${y}" width="${width}" height="${height}" rx="5"></rect>
          ${rows}
        </g>
      `;
    }

    function makeTicks(min, max, count) {
      if (count <= 1) return [min];
      const ticks = [];
      const step = (max - min) / (count - 1);
      for (let i = 0; i < count; i += 1) ticks.push(min + i * step);
      return ticks;
    }

    function buildPath(item, maxN, xFor, yFor) {
      let d = '';
      let open = false;
      sampleNs(maxN).forEach(n => {
        const value = valueFor(item, n);
        const y = yFor(value);
        if (!Number.isFinite(value) || !Number.isFinite(y)) {
          open = false;
          return;
        }
        const x = xFor(n);
        d += `${open ? 'L' : 'M'} ${x.toFixed(2)} ${y.toFixed(2)} `;
        open = true;
      });
      return d.trim();
    }

    function sampleNs(maxN) {
      const maxPoints = 800;
      if (maxN <= maxPoints) {
        return Array.from({ length: maxN }, (_, i) => i + 1);
      }

      const samples = new Set([1, maxN]);
      const step = (maxN - 1) / (maxPoints - 1);
      for (let i = 0; i < maxPoints; i += 1) {
        samples.add(Math.round(1 + i * step));
      }
      return Array.from(samples).sort((a, b) => a - b);
    }

    function valueFor(item, n) {
      const value = item.parsed.fn(n);
      return Number.isFinite(value) ? value : NaN;
    }

    function formatValue(value) {
      if (!Number.isFinite(value)) return '-';
      if (Math.abs(value) < 1e-10) return '0';
      const abs = Math.abs(value);
      if (abs >= 1e7 || abs < 0.001) return value.toExponential(2);
      if (abs >= 1000) return Math.round(value).toLocaleString();
      if (abs >= 100) return value.toFixed(1);
      if (abs >= 10) return value.toFixed(2);
      return value.toFixed(3);
    }

    function parseExpression(source) {
      const expr = String(source || '').trim();
      if (!expr) {
        return { ok: false, error: 'Enter a function.' };
      }

      try {
        const tokens = tokenize(expr);
        const parser = new Parser(tokens);
        const ast = parser.parse();
        return {
          ok: true,
          fn: n => evaluateAst(ast, n)
        };
      } catch (error) {
        return {
          ok: false,
          error: error.message || 'Could not parse function.'
        };
      }
    }

    function tokenize(source) {
      const text = source
        .toLowerCase()
        .replaceAll(',', '')
        .replaceAll('x', 'n')
        .replaceAll('\u00d7', '*')
        .replaceAll('\u2212', '-')
        .replaceAll('\u2013', '-')
        .replaceAll('\u2014', '-');
      const tokens = [];
      let i = 0;

      while (i < text.length) {
        const char = text[i];

        if (/\s/.test(char)) {
          i += 1;
          continue;
        }

        const numberMatch = text.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/);
        if (numberMatch) {
          tokens.push({ type: 'number', value: Number(numberMatch[0]) });
          i += numberMatch[0].length;
          continue;
        }

        if ('+-*/^()'.includes(char)) {
          tokens.push({ type: 'operator', value: char });
          i += 1;
          continue;
        }

        if (char === 'n') {
          tokens.push({ type: 'variable' });
          i += 1;
          continue;
        }

        if (text.startsWith('ln', i)) {
          tokens.push({ type: 'func', name: 'ln' });
          i += 2;
          continue;
        }

        if (text.startsWith('lg', i)) {
          tokens.push({ type: 'func', name: 'lg' });
          i += 2;
          continue;
        }

        if (text.startsWith('sqrt', i)) {
          tokens.push({ type: 'func', name: 'sqrt' });
          i += 4;
          continue;
        }

        if (text.startsWith('log', i)) {
          let j = i + 3;
          if (text[j] === '_') j += 1;
          const baseMatch = text.slice(j).match(/^(?:\d+\.?\d*|\.\d+)/);
          const base = baseMatch ? Number(baseMatch[0]) : null;
          if (baseMatch) j += baseMatch[0].length;
          tokens.push({ type: 'func', name: 'log', base });
          i = j;
          continue;
        }

        throw new Error(`Could not parse near "${escapeHtml(source.slice(i, i + 8))}".`);
      }

      return tokens;
    }

    class Parser {
      constructor(tokens) {
        this.tokens = tokens;
        this.pos = 0;
      }

      parse() {
        const expr = this.parseSum();
        if (!this.isDone()) {
          throw new Error('Unexpected text after the function.');
        }
        return expr;
      }

      parseSum() {
        let left = this.parseProduct();
        while (this.matchOperator('+') || this.matchOperator('-')) {
          const op = this.previous().value;
          const right = this.parseProduct();
          left = { type: 'binary', op, left, right };
        }
        return left;
      }

      parseProduct() {
        let left = this.parsePower();
        while (!this.isDone()) {
          if (this.matchOperator('*') || this.matchOperator('/')) {
            const op = this.previous().value;
            const right = this.parsePower();
            left = { type: 'binary', op, left, right };
            continue;
          }

          if (this.beginsImplicitProduct(this.peek())) {
            const right = this.parsePower();
            left = { type: 'binary', op: '*', left, right };
            continue;
          }

          break;
        }
        return left;
      }

      parsePower() {
        let left = this.parseUnary();
        if (this.matchOperator('^')) {
          const right = this.parsePower();
          left = { type: 'binary', op: '^', left, right };
        }
        return left;
      }

      parseUnary() {
        if (this.matchOperator('+')) return this.parseUnary();
        if (this.matchOperator('-')) return { type: 'negate', expr: this.parseUnary() };
        return this.parsePrimary();
      }

      parsePrimary() {
        const token = this.advance();
        if (!token) throw new Error('Missing part of the function.');

        if (token.type === 'number') {
          return { type: 'number', value: token.value };
        }

        if (token.type === 'variable') {
          return { type: 'variable' };
        }

        if (token.type === 'func') {
          return {
            type: 'func',
            name: token.name,
            base: token.base,
            arg: this.parseFunctionArgument()
          };
        }

        if (token.type === 'operator' && token.value === '(') {
          const expr = this.parseSum();
          if (!this.matchOperator(')')) {
            throw new Error('Missing closing parenthesis.');
          }
          return expr;
        }

        throw new Error('Expected a number, n, x, log, sqrt, or parentheses.');
      }

      parseFunctionArgument() {
        if (this.isDone()) {
          throw new Error('A log function needs an argument.');
        }
        return this.parsePower();
      }

      beginsImplicitProduct(token) {
        if (!token) return false;
        return token.type === 'number'
          || token.type === 'variable'
          || token.type === 'func'
          || (token.type === 'operator' && token.value === '(');
      }

      matchOperator(value) {
        const token = this.peek();
        if (token && token.type === 'operator' && token.value === value) {
          this.pos += 1;
          return true;
        }
        return false;
      }

      advance() {
        if (this.isDone()) return null;
        const token = this.tokens[this.pos];
        this.pos += 1;
        return token;
      }

      previous() {
        return this.tokens[this.pos - 1];
      }

      peek() {
        return this.tokens[this.pos] || null;
      }

      isDone() {
        return this.pos >= this.tokens.length;
      }
    }

    function evaluateAst(node, n) {
      if (node.type === 'number') return node.value;
      if (node.type === 'variable') return n;
      if (node.type === 'negate') return -evaluateAst(node.expr, n);

      if (node.type === 'binary') {
        const left = evaluateAst(node.left, n);
        const right = evaluateAst(node.right, n);
        if (node.op === '+') return left + right;
        if (node.op === '-') return left - right;
        if (node.op === '*') return left * right;
        if (node.op === '/') return right === 0 ? NaN : left / right;
        if (node.op === '^') return Math.pow(left, right);
      }

      if (node.type === 'func') {
        const value = evaluateAst(node.arg, n);
        if (node.name === 'sqrt') {
          return value < 0 ? NaN : Math.sqrt(value);
        }
        const base = logBaseFor(node);
        if (value <= 0 || base <= 0 || base === 1) return NaN;
        return Math.log(value) / Math.log(base);
      }

      return NaN;
    }

    function logBaseFor(node) {
      if (node.name === 'ln') return Math.E;
      if (node.name === 'lg') return 2;
      return node.base || 2;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    presetEl.innerHTML = presets.map((preset, i) =>
      `<option value="${i}">${i + 1}. ${preset.name}</option>`
    ).join('');

    presetEl.addEventListener('change', () => applyPreset(Number(presetEl.value)));
    scaleEl.addEventListener('change', render);
    maxNEl.addEventListener('input', handleMaxNInput);
    maxNEl.addEventListener('change', commitMaxNInput);
    maxNEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        commitMaxNInput();
        maxNEl.blur();
      }
    });
    maxNRangeEl.addEventListener('input', () => { setMaxN(maxNRangeEl.value); render(); });
    focusNEl.addEventListener('input', handleFocusNInput);
    focusNEl.addEventListener('change', commitFocusNInput);
    focusNEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        commitFocusNInput();
        focusNEl.blur();
      }
    });
    focusNRangeEl.addEventListener('input', () => { setFocusN(focusNRangeEl.value); render(); });
    functionRowsEl.addEventListener('input', (event) => syncRowFromInput(event.target));
    functionRowsEl.addEventListener('change', (event) => syncRowFromInput(event.target));

    applyPreset(0);
  </script>
</body>
</html>
