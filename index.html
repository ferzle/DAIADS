  <style>
  /* container pinned in lower-left */
#scroll-controls {
  position: fixed;
  bottom: 1rem;
  left: 1rem;
  display: flex;
  gap: 0.5rem;         /* space between buttons */
  z-index: 1000;
}

/* buttons inherit whatever styles you already had */
#to-top,
#to-bottom {
  background: #333;
  color: #fff;
  border: none;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background-color 0.2s;
}

#to-top:hover,
#to-bottom:hover {
  background: #111;
}

#to-top.hidden,
#to-bottom.hidden {
  display: none;
}

header {
  position: relative;
}
#hamburger {
  position: sticky;
  top: 0.25rem;
  width: 1.75rem;
  min-height: 1.75rem;
  margin: 0 0 0.5rem 0;
  padding: 0 4px;
  line-height: 1;
  font-size: 1.2rem;
  border: none;
  cursor: pointer;
  z-index: 1100;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

body.mainSite header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 16px;
  position: relative;
  padding-left: 160px;
  padding-right: 16px;
}

.headerText {
  min-width: 0;
  text-align: center;
}

/* Keep the menu control available when the table of contents is collapsed. */
body.mainSite nav#menu.collapsed {
  display: block;
  width: 2.5rem;
  flex: 0 0 2.5rem;
  padding: 0.25rem;
  overflow: visible;
}

#menu.collapsed #menu-content {
  display: none;
}

#menu.collapsed #hamburger {
  margin-bottom: 0;
}

/* Expand iframe to full width when menu is collapsed */
#container.menu-collapsed #content-wrapper {
  width: 100% !important;
}

/* Default container layout */
#container {
  display: flex;
}

/* Sidebar menu */
#menu {
  width: 250px;
  flex-shrink: 0;
}

/* Iframe content */
#content {
  flex: 1;
  width: 100%;
  min-width: 0;
}

#content-wrapper {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
}
/*-----------------------------------------------------------------------*/
/* LOGO STUFF */
#siteLogo {
  position: absolute;
  top: 7px;   /* distance from top */
  left: 30px;     /* distance from left */
  width: 140px;
  height: 65px;
  padding: 2px 6px;   /* minimal padding */
  background: #e5e7eb;
  border-radius: 16px;

  display: grid;
  place-items: center;
}

#siteLogo .wordmark {
  font-family: 'Barlow Condensed', Arial, sans-serif;
  font-weight: 700;
  font-size: 3.2rem;
  letter-spacing: -0.04em;
  line-height: 1;
  white-space: nowrap;
  transform: scaleY(1.4) translateY(-1px);
  transform-origin: center;

  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}

#siteLogo .r { color: #8f4a3a; }
#siteLogo .g { color: #566e4e; }
#siteLogo .y { color: #c5a24f; }

</style>

<body class="mainSite">
  <a class="skip-link" href="#content-wrapper">Skip to main content</a>
  <p id="route-status" class="visually-hidden" aria-live="polite"></p>
  <div id="pageWrapper">
    <header>
<div id="siteLogo" aria-hidden="true">
  <div class="wordmark"><span class="g">D</span><span class="g">A</span><span class="g">I</span><span class="y">A</span><span class="r">D</span><span class="r">S</span></div>
</div>
      <div class="headerText">
	      <h1>Design, Analysis, and Implementation of <br>Algorithms and Data Structures</h1>
      </div>
    </header>

    <div id="container">

      <nav id="menu" aria-label="Table of contents">
        <button id="hamburger" type="button" aria-label="Hide table of contents"
                aria-controls="menu-content" aria-expanded="true">&equiv;</button>
        <div id="menu-content">
          <ul></ul>
        </div>
      </nav>
      <main id="content-wrapper" tabindex="-1">
        <iframe
            id="content"
            src=""
            title="Lesson content"
            frameborder="0"
            allow="fullscreen"
            scrolling="no"
            >
        </iframe>
        <div id="errorMessage"
             class="error"
             role="alert"
             style="display:none;">Error loading content: Page not found.</div>
      </main>
        </div>
  </div>

<div id="scroll-controls">
  <button id="to-top" type="button" aria-label="Back to top">⬆ Top</button>
  <button id="to-bottom" type="button" aria-label="Scroll to bottom">⬇ Bottom</button>
</div>

  <script src="/DAIADS/scripts/loadContent.js"></script>
  <script>
  const toTop    = document.getElementById('to-top');
  const toBottom = document.getElementById('to-bottom');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const scrollBehavior = () => prefersReducedMotion.matches ? 'auto' : 'smooth';

  // scroll actions
  toTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: scrollBehavior() });
  });
  toBottom.addEventListener('click', () => {
    window.scrollTo({ top: document.documentElement.scrollHeight,
                      behavior: scrollBehavior() });
  });
const HIDE_THRESHOLD = 100;  // px from top/bottom

window.addEventListener('scroll', () => {
  const scrollY   = window.scrollY;
  const innerH    = window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;

  // hide Top when you're within HIDE_THRESHOLD px of the very top
  const nearTop = scrollY <= HIDE_THRESHOLD;
  toTop.classList.toggle('hidden', nearTop);

  // hide Bottom when you're within HIDE_THRESHOLD px of the very bottom
  const nearBottom = innerH + scrollY >= docHeight - HIDE_THRESHOLD;
  toBottom.classList.toggle('hidden', nearBottom);
});
  const hamburger = document.getElementById('hamburger');
  const setMenuCollapsed = (collapsed) => {
    const menu = document.getElementById('menu');
    const container = document.getElementById('container');
    menu.classList.toggle('collapsed', collapsed);
    container.classList.toggle('menu-collapsed', collapsed);
    hamburger.setAttribute('aria-expanded', String(!collapsed));
    hamburger.setAttribute('aria-label', collapsed
      ? 'Show table of contents'
      : 'Hide table of contents');
  };

  hamburger.addEventListener('click', () => {
    setMenuCollapsed(!document.getElementById('menu').classList.contains('collapsed'));
  });

  if (window.matchMedia('(max-width: 700px)').matches) {
    setMenuCollapsed(true);
  }

  document.querySelector('.skip-link').addEventListener('click', event => {
    event.preventDefault();
    const main = document.getElementById('content-wrapper');
    main.focus();
  });
</script>
